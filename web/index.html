<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<meta name="mobile-web-app-capable" content="yes">
<title>EH! FRESHY POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Prompt;font-weight:500;font-display:swap;src:url(fonts/prompt-thai-500-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:700;font-display:swap;src:url(fonts/prompt-thai-700-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:800;font-display:swap;src:url(fonts/prompt-thai-800-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:500;font-display:swap;src:url(fonts/prompt-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Prompt;font-weight:700;font-display:swap;src:url(fonts/prompt-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Prompt;font-weight:800;font-display:swap;src:url(fonts/prompt-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --yolk:#FFAE1A; --yolk-deep:#E89400; --ink:#1A1A1A; --ink-2:#3A3A3A; --mute:#6E6E73;
  --chalk:#F2F2F0; --line:#E2E2DE; --white:#fff;
  --berry:#E5365B; --lime:#4CB944; --grape:#7B3FBF; --ok:#1F9D55; --bad:#D93025;
  --r-tile:26px 26px 26px 7px; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Prompt,"Noto Sans Thai",system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--chalk);font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Views ---------- */
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--chalk)}
.flow{z-index:20}
.sheet-wrap{z-index:40}

/* ---------- Login ---------- */
#v-login{background:var(--ink);color:#fff;align-items:center;justify-content:center;gap:18px;padding:24px;overflow:auto}
#v-login .logo{width:min(46vw,210px);height:auto}
.pin-dots{display:flex;gap:14px;height:22px;align-items:center}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid #555;transition:background .08s,border-color .08s}
.pin-dots i.on{background:var(--yolk);border-color:var(--yolk)}
.pin-msg{min-height:24px;color:#ffb4a8;font-size:15px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:68px;border-radius:22px 22px 22px 8px;background:#2B2B2B;color:#fff;font-size:28px;font-weight:700}
.pad button:active{background:var(--yolk);color:var(--ink)}
.pad .go{background:var(--yolk);color:var(--ink);font-size:20px;font-weight:800}
.pad .go:disabled{opacity:.35}
.link{color:#9a9a9a;font-size:14px;text-decoration:underline;padding:8px}
@media (max-height:640px){.pad{grid-template-columns:repeat(3,64px);gap:8px}.pad button{height:54px;font-size:24px}#v-login{gap:10px}#v-login .logo{width:110px}}

/* ---------- Top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;height:64px;z-index:10;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--white);border-bottom:2px solid var(--ink)}
.top .logo{height:42px;width:auto;display:block}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button{padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;color:var(--ink-2)}
.nav button.on{background:var(--ink);color:var(--yolk)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--chalk);font-size:13px;font-weight:700;white-space:nowrap}
.pill b{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block}
.pill.warn b{background:var(--yolk-deep)}
.pill.bad b{background:var(--bad)}
.who{font-size:14px;color:var(--mute);white-space:nowrap}
@media (max-width:640px){.who{display:none}.nav button{padding:9px 10px;font-size:14px}.top{padding:6px 10px;gap:6px}.top .logo{height:34px}.pill span.t{display:none}}

/* ---------- POS ---------- */
.pos-body{flex:1;min-height:0;display:flex}
.menu{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:11px 20px;border-radius:999px;background:var(--white);font-weight:700;border:2px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--yolk);border-color:var(--ink)}
.grid{flex:1;overflow-y:auto;padding:10px 14px 110px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-content:start}
.tile{position:relative;text-align:left;border-radius:var(--r-tile);padding:14px 14px 12px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .nm{font-size:19px;font-weight:800;line-height:1.15}
.tile .sub{font-size:12.5px;opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.tile .pr{align-self:flex-end;padding:5px 13px;border-radius:999px;font-weight:800;font-size:17px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 10px}

.cart{width:360px;flex:none;background:var(--white);border-left:2px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.cart h2{padding:14px 16px 8px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cart h2 button{display:none;font-size:15px;color:var(--mute);padding:6px 10px}
.lines{flex:1;overflow-y:auto;padding:0 12px}
.line{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:start}
.line .dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.line .t{font-weight:700;line-height:1.2}
.line .d{font-size:13px;color:var(--mute);margin-top:2px}
.line .rt{text-align:right}
.line .p{font-weight:800}
.stepper{display:inline-flex;align-items:center;gap:2px;margin-top:6px;background:var(--chalk);border-radius:999px}
.stepper button{width:34px;height:34px;font-size:20px;font-weight:800;border-radius:50%}
.stepper span{min-width:22px;text-align:center;font-weight:800}
.cart-foot{padding:12px 16px calc(14px + var(--safe-b));border-top:2px solid var(--ink);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-size:30px}
.btn{height:58px;border-radius:18px 18px 18px 7px;font-weight:800;font-size:18px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--yolk);color:var(--ink);box-shadow:0 4px 0 var(--yolk-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yolk-deep)}
.btn.primary:disabled{background:#ddd;color:#999;box-shadow:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--chalk);color:var(--ink)}
.btn.danger{background:#FDE7E4;color:var(--bad)}
.btn.sm{height:42px;font-size:15px;padding:0 14px;border-radius:13px 13px 13px 5px}
.cart-bar{display:none}
@media (max-width:899px){
  .cart{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82vh;border-left:0;border-radius:26px 26px 0 0;border-top:2px solid var(--ink);transform:translateY(105%);transition:transform .22s ease;z-index:30}
  .cart.open{transform:none}
  .cart h2 button{display:block}
  .cart-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:62px;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--ink);color:#fff;border-radius:20px 20px 20px 7px;font-weight:800;font-size:17px}
  .cart-bar b{color:var(--yolk);font-size:22px}
  .cart-bar[hidden]{display:none!important}
  .grid{padding-bottom:100px;grid-template-columns:repeat(2,1fr)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
}
@media (min-width:900px){.scrim{display:none}}

/* ---------- Sheet (เลือกรายละเอียดแก้ว) ---------- */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--white);border-radius:28px 28px 0 0;padding:20px 20px calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;display:grid;gap:16px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px 28px 28px 8px}}
.sheet .hd{display:flex;gap:14px;align-items:center}
.sheet .sw{width:54px;height:54px;border-radius:20px 20px 20px 6px;flex:none}
.sheet h3{font-size:22px;font-weight:800;line-height:1.1}
.sheet .s{font-size:13px;color:var(--mute);margin-top:3px}
.grp-t{font-weight:800;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:12px 18px;border-radius:14px 14px 14px 5px;background:var(--chalk);border:2px solid transparent;font-weight:700;min-height:48px}
.chip.on{background:var(--ink);color:var(--yolk)}
.chip small{font-weight:700;opacity:.75;margin-left:4px}
.note{font-size:14px;background:var(--chalk);padding:10px 12px;border-radius:12px;color:var(--ink-2)}
.qty-row{display:flex;align-items:center;justify-content:space-between}
.qty-row .stepper{margin:0}
.qty-row .stepper button{width:46px;height:46px;font-size:24px}
.qty-row .stepper span{font-size:20px;min-width:34px}

/* ---------- Flow pages (สรุป / ชำระ / เสร็จ) ---------- */
.fhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border-bottom:2px solid var(--ink);flex:none}
.fhead h2{font-size:19px;font-weight:800}
.fbody{flex:1;overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start;max-width:980px;width:100%;margin:0 auto}
@media (min-width:900px){.fbody.two{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--white);border-radius:22px 22px 22px 8px;padding:16px;display:grid;gap:12px}
.card h3{font-size:16px;font-weight:800}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--ink-2)}
.inp{height:52px;border-radius:14px;border:2px solid var(--line);padding:0 14px;background:#fff;width:100%;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--ink);outline:none}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.sum-line.big{font-size:22px;font-weight:800}
.sum-line .m{color:var(--mute);font-weight:500;font-size:13px}
.ffoot{padding:12px 14px calc(12px + var(--safe-b));background:var(--white);border-top:2px solid var(--ink);display:flex;gap:10px;flex:none}
.ffoot .btn{flex:1}
.paytabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paytabs button{height:54px;border-radius:16px 16px 16px 6px;background:var(--chalk);font-weight:800}
.paytabs button.on{background:var(--ink);color:var(--yolk)}
.qrbox{display:grid;justify-items:center;gap:10px;text-align:center}
.qrbox canvas,.qrbox img{width:min(78vw,300px);height:auto;image-rendering:pixelated;background:#fff;padding:10px;border-radius:18px;border:2px solid var(--ink)}
.qr-amt{font-size:40px;font-weight:800}
.qr-warn{background:#FFF1D6;border-radius:14px;padding:12px;font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.change{font-size:30px;font-weight:800}
.doneq{background:var(--yolk);border-radius:36px 36px 36px 10px;padding:26px 34px 22px;text-align:center;transform:rotate(-2deg);margin:12px auto 0;box-shadow:0 6px 0 var(--ink)}
.doneq small{display:block;font-weight:700;font-size:15px}
.doneq b{display:block;font-size:84px;line-height:1;font-weight:800;letter-spacing:1px}
.stat{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;font-weight:700}

/* ---------- Dashboard / Settings ---------- */
.page{flex:1;overflow-y:auto;padding:14px 14px 40px}
.page-in{max-width:1100px;margin:0 auto;display:grid;gap:14px}
#dashOut{display:grid;gap:14px}
.range{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--white);border-radius:20px 20px 20px 7px;padding:14px}
.kpi .l{font-size:13px;color:var(--mute);font-weight:700}
.kpi .v{font-size:28px;font-weight:800;margin-top:2px}
.kpi .h{font-size:12.5px;color:var(--mute);margin-top:2px}
.kpi.ink{background:var(--ink);color:#fff}.kpi.ink .l,.kpi.ink .h{color:#bbb}.kpi.ink .v{color:var(--yolk)}
.cols{display:grid;gap:14px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar .bar{height:16px;background:var(--chalk);border-radius:8px;overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:8px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.vbars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px;overflow-x:auto}
.vbars .c{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11px}
.vbars .c i{width:100%;background:var(--ink);border-radius:7px 7px 2px 2px;min-height:2px}
.vbars .c.peak i{background:var(--yolk)}
.vbars .c span{color:var(--mute);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12.5px;color:var(--mute)}
.insight{display:grid;gap:8px}
.insight li{list-style:none;background:var(--chalk);border-radius:14px;padding:10px 12px;font-size:14.5px}
ul{margin:0;padding:0}
.sec-t{font-size:15px;font-weight:800}
.hint{font-size:13px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-list{display:grid;gap:8px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.admin-item:last-child{border-bottom:0}.admin-meta{min-width:0}.admin-meta b{display:block;overflow-wrap:anywhere}.admin-meta small{color:var(--ink-2)}.admin-actions{display:flex;gap:6px;flex-shrink:0}.admin-actions .btn{height:36px;padding:0 10px;font-size:13px}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rowl:last-child{border-bottom:0}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}

/* ---------- Print (โหมดพิมพ์ผ่านเบราว์เซอร์) ---------- */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;page-break-after:always;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

var qrcode = function() {

  /**

  var qrcode = function(typeNumber, errorCorrectionLevel) {

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      }

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;

        }

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

        break;

        newData = qrAlphaNum(data);

/* ---------- API ---------- */
function apiUrl() { return LS.get('eh_api', '') || API_URL_DEFAULT; }

async function api(action, payload = {}, auth = true) {
  const url = apiUrl();
  if (!url) throw new Error('no_api');
  const body = Object.assign({ action }, payload);
  if (auth) body.token = S.session && S.session.token;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal, redirect: 'follow' });
    return await r.json();
  } finally { clearTimeout(t); }
}

function tokenExp(tok) {
  try {
    let b = tok.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)))).e;
  } catch { return 0; }
}

}

/* =====================================================================

function lum(hex) {
  const c = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255)
    .map(x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function fgFor(hex) {
  const L = lum(hex); const withInk = (L + 0.05) / (lum('#1A1A1A') + 0.05), withWhite = 1.05 / (L + 0.05);
  return withInk >= withWhite ? '#1A1A1A' : '#FFFFFF';
}

function counter() {

const fmtQueue = n => S.dev.letter + pad(n, 3);

/* =====================================================================
   สรุปออเดอร์
   ===================================================================== */
function manualDiscountVal() { return Math.max(0, Math.min(cartSub(), Math.round(Number(String($('#disc').value).replace(/\D/g, '')) || 0))); }
function activePromotions() {
  const today = ymd(new Date());
  return ((S.cfg && S.cfg.promotions) || []).filter(p => p.active !== false && (!p.startDate || p.startDate <= today) && (!p.endDate || p.endDate >= today));
}
function calcPromotion(p) {
  if (!p) return 0;
  const qty = S.cart.reduce((n, l) => n + l.qty, 0);
  if (qty < Number(p.minQty || 1)) return 0;
  const ids = String(p.eligibleMenuIds || '').split(',').map(x => x.trim()).filter(Boolean);
  const lines = ids.length ? S.cart.filter(l => ids.includes(String(l.item.id))) : S.cart;
  if (!lines.length) return 0;
  const eligibleTotal = lines.reduce((n, l) => n + lineTotal(l), 0);
  if (!eligibleTotal) return 0;
  const val = p.type === 'percent' ? Math.round(eligibleTotal * Number(p.value || 0) / 100) : Number(p.value || 0);
  return Math.max(0, Math.min(eligibleTotal, Math.round(val)));
}
function discountVal() {
  const manual = manualDiscountVal();
  const promo = Math.min(calcPromotion(S.selectedPromo), Math.max(0, cartSub() - manual));
  S.promoDiscount = promo;
  return Math.max(0, Math.min(cartSub(), manual + promo));
}
const orderTotal = () => cartSub() - S.discount;

/* =====================================================================
   ชำระเงิน: QR พร้อมเพย์ / เงินสด
   ===================================================================== */
function crc16(str) {
  let c = 0xFFFF;
  for (let i = 0; i < str.length; i++) { c ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + pad(v.length, 2) + v;

function promptPayPayload(idRaw, amount) {
  const id = String(idRaw).replace(/\D/g, '');
  let sub, val;
  if (id.length === 15) { sub = '03'; val = id; }
  else if (id.length === 13) { sub = '02'; val = id; }
  else if (id.length === 10) { sub = '01'; val = '0066' + id.slice(1); }
  else return null;
  const acct = tlv('00', 'A000000677010111') + tlv(sub, val);
  let p = tlv('00', '01') + tlv('01', amount > 0 ? '12' : '11') + tlv('29', acct) + tlv('53', '764');
  if (amount > 0) p += tlv('54', amount.toFixed(2));
  p += tlv('58', 'TH') + '6304';
  return p + crc16(p);
}

function ppId() { return S.dev.pp || setting('promptpay_id', ''); }

function openPay() {
  const total = orderTotal();
  if (setting('require_demographics', 'FALSE').toUpperCase() === 'TRUE' && (!S.cust.gender || !S.cust.age)) {

function drawQr(total) {

    holder.innerHTML = `<div class="qr-warn">${id ? 'รูปแบบ PromptPay ID ไม่ถูกต้อง' : 'ยังไม่ได้ตั้งเลขพร้อมเพย์'} — ไปที่ <b>ตั้งค่า</b> (หรือใส่ promptpay_id ในชีต Settings) แล้วกลับมาใหม่ หรือใช้เงินสดไปก่อน</div>`;
    $('#qrHint').hidden = true; return;
  }
  const qr = qrcode(0, 'M'); qr.addData(payload); qr.make();
  holder.innerHTML = `<img alt="QR PromptPay ${total} บาท" src="${qr.createDataURL(8, 2)}">`;

/* =====================================================================
   จบออเดอร์: บันทึกคิว → ส่งชีต → พิมพ์สติกเกอร์
   ===================================================================== */
let finalizing = false;
async function finalizeOrder() {
  if (finalizing) return;
  const total = orderTotal();
  let received = 0, change = 0;
  if (S.payMethod === 'cash') {
    received = cashIn();
    if (received < total) { toast('จำนวนเงินที่รับมาน้อยกว่ายอดชำระ', true); return; }
    change = received - total;
  }
  finalizing = true;
  try {
    const q = takeQueue(), now = new Date();
    const order = {
      id: `${q.date.replace(/-/g, '').slice(2)}-${S.dev.letter}${pad(q.n, 3)}`,
      queueNo: q.queueNo, device: S.dev.letter, createdAt: now.toISOString(),
      customerName: S.cust.name, gender: S.cust.gender, ageRange: S.cust.age,
      items: S.cart.map(l => ({
        menuId: l.item.id, category: l.item.category, name: l.item.name, tier: l.item.tier,
        sweetness: l.item.isDrink ? l.sweetness : '', toppings: l.toppings.map(t => t.name),
        basePrice: l.basePrice, toppingsPrice: l.toppings.reduce((s, t) => s + t.price, 0), qty: l.qty, lineTotal: lineTotal(l),
        unitCost: ((S.cfg && S.cfg.costs) || []).filter(c => c.menuId === l.item.id).reduce((n,c) => n + Number(c.unitCost || 0), 0) + l.toppings.reduce((n,t) => n + (((S.cfg && S.cfg.costs) || []).filter(c => c.menuId === 'addon:' + t.id).reduce((x,c) => x + Number(c.unitCost || 0), 0)), 0)
      })),
      costComplete: S.cart.every(l => ((S.cfg && S.cfg.costs) || []).some(c => c.menuId === l.item.id) && l.toppings.every(t => ((S.cfg && S.cfg.costs) || []).some(c => c.menuId === 'addon:' + t.id))),
      subtotal: cartSub(), discount: S.discount, manualDiscount: manualDiscountVal(), promoDiscount: S.promoDiscount, promoId: S.selectedPromo ? S.selectedPromo.id : '', promoName: S.selectedPromo ? S.selectedPromo.name : '', total, paymentMethod: S.payMethod === 'qr' ? 'promptpay' : 'cash',
      cashReceived: received || '', change: change || '', note: ''
    };
    const queue = LS.get('eh_queue', []); queue.push(order); LS.set('eh_queue', queue);

/* ---------- คิวส่งข้อมูลเข้าชีต (ทำงานออฟไลน์ได้ ส่งซ้ำอัตโนมัติ) ---------- */
let syncing = false;
async function syncQueue() {
  if (syncing) return; syncing = true;
  try {
    for (;;) {
      const q = LS.get('eh_queue', []); if (!q.length) break;
      if (!S.session || tokenExp(S.session.token) < Date.now()) { S.needLogin = true; break; }
      let r;
      try { r = await api('submitOrder', { order: q[0] }); } catch (e) { S.offline = true; break; }
      if (r.ok) {
        S.offline = false; S.needLogin = false;
        q.shift(); LS.set('eh_queue', q);
        markSynced();
      } else if (r.error === 'auth') { S.needLogin = true; break; }
      else { // ออเดอร์เสียรูปแบบ — แยกออกไม่ให้คิวติด
        const failed = LS.get('eh_failed', []); failed.push(Object.assign({ err: r.error }, q.shift())); LS.set('eh_failed', failed); LS.set('eh_queue', q);
      }
    }
  } finally { syncing = false; updateSyncPill(); }
}
function markSynced() {
  const pending = new Set(LS.get('eh_queue', []).map(o => o.id));
  const rec = LS.get('eh_recent', []); rec.forEach(o => { o.synced = !pending.has(o.id); }); LS.set('eh_recent', rec);
  if (S.lastOrder && S.view === 'done') {
    const done = !pending.has(S.lastOrder.id);

}
function updateSyncPill() {

  p.className = 'pill' + (S.needLogin && n ? ' bad' : (n || S.offline) ? ' warn' : '');
  $('#syncTxt').textContent = S.needLogin && n ? `${n} รายการรอ — เข้าสู่ระบบใหม่` : n ? `รอส่ง ${n}` : S.offline ? 'ออฟไลน์' : 'ซิงก์แล้ว';
  if (S.view === 'done' && S.lastOrder) markSynced();
}

/* =====================================================================
   พิมพ์สติกเกอร์ติดแก้ว (ESC/POS raster — รองรับภาษาไทยเพราะวาดเป็นรูป)

const PAGE_DOTS = 384;                      // เครื่อง 58 mm พิมพ์ได้กว้าง 48 mm = 384 จุด (203 dpi)
const DOTS_MM = 8;
const logoMono = new Image(); logoMono.src = LOGO_MONO;

function stickerSize() {
  const w = Number(S.dev.w || setting('sticker_width_mm', 50)), h = Number(S.dev.h || setting('sticker_height_mm', 30));
  return { wMm: w, hMm: h, W: Math.min(PAGE_DOTS, Math.floor(w * DOTS_MM / 8) * 8), H: Math.round(h * DOTS_MM) };
}

function expandCups(order) {
  const cups = []; order.items.forEach(it => { for (let i = 0; i < it.qty; i++) cups.push(it); });
  return cups.map((it, i) => ({ it, n: i + 1, of: cups.length }));
}

function fit(g, text, weight, size, maxW, min = 14) {
  let s = size; g.font = `${weight} ${s}px Prompt`;
  while (g.measureText(text).width > maxW && s > min) { s -= 1; g.font = `${weight} ${s}px Prompt`; }
  return s;
}
function wrap(g, text, maxW, maxLines) {
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

async function drawSticker(order, cup) {
  await document.fonts.load('800 20px Prompt'); await document.fonts.load('500 20px Prompt');
  const { W, H } = stickerSize(), offX = Math.max(0, Math.floor((PAGE_DOTS - W) / 2)) + Number(S.dev.offx || 0);
  const c = document.createElement('canvas'); c.width = PAGE_DOTS; c.height = H;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, PAGE_DOTS, H); g.fillStyle = '#000'; g.textBaseline = 'top';
  const s = H / 240, m = Math.round(12 * s), x0 = offX + m, innerW = W - m * 2;
  let y = Math.round(10 * s);
  // คิว + โลโก้
  const lh = Math.round(58 * s), lw = Math.round(lh * logoMono.width / (logoMono.height || 1)) || lh;
  g.font = `800 ${Math.round(66 * s)}px Prompt`; g.fillText(order.queueNo, x0, y - Math.round(6 * s));
  if (logoMono.complete && logoMono.naturalWidth) g.drawImage(logoMono, x0 + innerW - lw, y, lw, lh);
  y += Math.round(64 * s);
  // ชื่อเมนู
  const nm = cup.it.name.replace(/^EH!\s*/i, '');
  const fs = fit(g, nm, 800, Math.round(34 * s), innerW, 16); g.fillText(nm, x0, y); y += Math.round(fs * 1.25);
  // ความหวาน
  const sweets = splitList(setting('sweetness_options', 'ปกติ,ลดหวาน')), isDrink = !!cup.it.sweetness;
  if (isDrink) {
    const label = 'หวาน' + cup.it.sweetness, reduced = cup.it.sweetness !== sweets[0];
    g.font = `800 ${Math.round(24 * s)}px Prompt`; const tw = g.measureText(label).width, ph = Math.round(30 * s);
    if (reduced) { g.fillRect(x0, y, tw + Math.round(16 * s), ph); g.fillStyle = '#fff'; g.fillText(label, x0 + Math.round(8 * s), y + Math.round(1 * s)); g.fillStyle = '#000'; }
    else { g.fillText(label, x0, y + Math.round(1 * s)); }
    y += ph + Math.round(2 * s);
  }
  // ท็อปปิ้ง
  if (cup.it.toppings && cup.it.toppings.length) {
    g.font = `700 ${Math.round(22 * s)}px Prompt`;
    wrap(g, '+ ' + cup.it.toppings.join(' + '), innerW, 2).forEach(l => { g.fillText(l, x0, y); y += Math.round(25 * s); });
  }
  // แถวล่าง
  const t = new Date(order.createdAt), time = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
  g.font = `500 ${Math.round(19 * s)}px Prompt`; const by = H - Math.round(28 * s);
  const right = `${cup.n}/${cup.of}  ${time}`; g.fillText(right, x0 + innerW - g.measureText(right).width, by);
  if (order.customerName) { const nmw = innerW - g.measureText(right).width - 12; fit(g, order.customerName, 700, Math.round(21 * s), nmw, 12); g.fillText(order.customerName, x0, by - 1); }
  return c;
}

function rasterBytes(canvas) {
  const g = canvas.getContext('2d'), w = canvas.width, h = canvas.height, d = g.getImageData(0, 0, w, h).data, wb = w / 8, parts = [];
  for (let y0 = 0; y0 < h; y0 += 128) {
    const bh = Math.min(128, h - y0), body = new Uint8Array(wb * bh);
    for (let y = 0; y < bh; y++) for (let xb = 0; xb < wb; xb++) {
      let b = 0;
      for (let bit = 0; bit < 8; bit++) { const i = ((y0 + y) * w + xb * 8 + bit) * 4; if (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114 < 150) b |= 0x80 >> bit; }
      body[y * wb + xb] = b;
    }
    parts.push(new Uint8Array([0x1D, 0x76, 0x30, 0, wb & 255, wb >> 8, bh & 255, bh >> 8]), body);
  }

}

async function buildJob(order) {
  const parts = [new Uint8Array([0x1B, 0x40])], canvases = [];
  for (const cup of expandCups(order)) {
    const cv = await drawSticker(order, cup); canvases.push(cv);
    parts.push(...rasterBytes(cv));
    const feed = Math.max(0, Math.min(255, Number(S.dev.feed) || 0)); if (feed) parts.push(new Uint8Array([0x1B, 0x4A, feed]));
  }
  const len = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(len); let o = 0;
  parts.forEach(p => { out.set(p, o); o += p.length; });
  return { bytes: out, canvases };
}

/* ---- Bluetooth (Web Bluetooth, Chrome บน Android) ---- */
const BLE_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455', '0000ae30-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb'];
let bleDev = null, bleChar = null;

async function connectPrinter(forcePick) {
  if (!navigator.bluetooth) throw new Error('เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth — ใช้ Chrome บน Android หรือเปลี่ยนโหมดเป็น RawBT');
  if (bleChar && bleDev && bleDev.gatt.connected && !forcePick) return bleChar;
  let dev = forcePick ? null : bleDev;
  if (!dev && !forcePick && navigator.bluetooth.getDevices) {
    const saved = LS.get('eh_printer', null);
    if (saved) { try { dev = (await navigator.bluetooth.getDevices()).find(d => d.id === saved.id) || null; } catch { } }
  }
  if (!dev) dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BLE_SERVICES });
  const server = await dev.gatt.connect();
  for (const sv of await server.getPrimaryServices()) {
    for (const ch of await sv.getCharacteristics()) {
      if (ch.properties.write || ch.properties.writeWithoutResponse) {
        bleDev = dev; bleChar = ch;
        dev.addEventListener('gattserverdisconnected', () => { bleChar = null; updatePrinterPill(); });
        LS.set('eh_printer', { id: dev.id, name: dev.name || 'Printer' });
        updatePrinterPill(); return ch;
      }
    }
  }
  throw new Error('เชื่อมต่อได้ แต่ไม่พบช่องส่งข้อมูล — เครื่องอาจเป็น Bluetooth Classic ให้ใช้โหมด RawBT');
}

async function bleSend(bytes) {
  let ch = await connectPrinter(false);
  const chunk = Number(S.dev.chunk) || 100;
  for (let i = 0; i < bytes.length; i += chunk) {
    const part = bytes.slice(i, i + chunk);
    if (ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(part); else await ch.writeValue(part);
    await sleep(10);
  }
}

function toBase64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }

  const cell = {}; orders.forEach(o => { const k = (o.age_range || '—') + '|' + (o.gender || '—'); cell[k] = (cell[k] || 0) + 1; });
  const aAll = [...aOpts, '—'], gAll = [...gOpts, '—'], maxCell = Math.max(1, ...Object.values(cell));
  const heat = `<table class="tbl"><tr><th>อายุ \\ เพศ</th>${gAll.map(g => `<th>${g === '—' ? 'ไม่ได้เลือก' : esc(g)}</th>`).join('')}</tr>${aAll.map(a => `<tr><td>${a === '—' ? 'ไม่ได้เลือก' : esc(a)}</td>${gAll.map(g => { const v = cell[a + '|' + g] || 0; return `<td class="num" style="background:rgba(255,174,26,${(v / maxCell * 0.85).toFixed(2)})">${v || ''}</td>`; }).join('')}</tr>`).join('')}</table>`;
  const seg = {}; items.forEach(i => { const a = i.age_range || '—'; const o = seg[a] = seg[a] || { hero: 0, core: 0 }; if (i.tier === 'hero') o.hero += N(i.qty); else if (i.tier === 'core') o.core += N(i.qty); });
  const segTbl = `<table class="tbl"><tr><th>อายุ</th><th>Hero</th><th>Core</th><th>% Hero</th></tr>${aAll.filter(a => seg[a]).map(a => { const o = seg[a], t = o.hero + o.core; return `<tr><td>${a === '—' ? 'ไม่ได้เลือก' : esc(a)}</td><td class="num">${o.hero}</td><td class="num">${o.core}</td><td class="num">${t ? Math.round(o.hero / t * 100) + '%' : '-'}</td></tr>`; }).join('')}</table>`;

  // CRM: ลูกค้าที่กลับมาซื้อซ้ำ (อิงชื่อที่กรอก — ใช้เป็นแนวโน้ม)
  const cust = {}; orders.filter(o => o.customer_name).forEach(o => { const k = o.customer_name.trim().toLowerCase(); const c = cust[k] = cust[k] || { name: o.customer_name.trim(), n: 0, spend: 0, last: '', fav: {} }; c.n++; c.spend += N(o.total); if (o.date > c.last) c.last = o.date; });
  items.filter(i => i.customer_name).forEach(i => { const c = cust[i.customer_name.trim().toLowerCase()]; if (c) c.fav[i.item_name] = (c.fav[i.item_name] || 0) + N(i.qty); });
  const repeaters = Object.values(cust).filter(c => c.n >= 2).sort((a, b) => b.n - a.n || b.spend - a.spend).slice(0, 10);
  const named = orders.filter(o => o.customer_name).length;
  const crmTbl = repeaters.length ? `<table class="tbl"><tr><th>ชื่อ</th><th>ครั้ง</th><th>ยอดรวม</th><th>ชอบ</th></tr>${repeaters.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${c.n}</td><td class="num">${baht(c.spend)}</td><td>${esc(Object.entries(c.fav).sort((a, b) => b[1] - a[1])[0]?.[0] || '')}</td></tr>`).join('')}</table>` : '<div class="hint">ยังไม่มีชื่อที่ซื้อซ้ำในช่วงนี้ (ต้องเลือกช่วง “ทั้งหมด” หรือเก็บชื่อให้ได้มากขึ้น)</div>';

  // Insight
  const ins = [];
  const bestH = hourRows.reduce((a, r) => r.v > a.v ? r : a, { v: -1 });
  ins.push(`ช่วงขายดีที่สุดคือ ${bestH.l}:00–${bestH.l}:59 น. (${bestH.v} บิล) — จัดคนและเตรียมของให้พร้อมก่อนช่วงนี้`);
  if (menuRows.length) ins.push(`ขายดีที่สุด: ${menuRows[0].l} (${menuRows[0].v} แก้ว)${menuRows.length > 1 ? ` · ขายน้อยที่สุด: ${menuRows[menuRows.length - 1].l} (${menuRows[menuRows.length - 1].v})` : ''}`);
  const heroPct = (tier.hero + tier.core) ? Math.round(tier.hero / (tier.hero + tier.core) * 100) : 0;
  ins.push(`AOV ${baht(aov.toFixed(0))} ${aov >= target ? 'ถึง' : 'ยังไม่ถึง'}เป้า ${baht(target)} ตามแผน · สัดส่วน Hero ${heroPct}% ของแก้ว Smoothie`);
  if (coreCups) ins.push(`Core ที่เพิ่มท็อปปิ้ง ${Math.round(coreTop / coreCups * 100)}% — ถ้าต่ำ ลองให้พนักงานเสนอท็อปปิ้งตัวเดียว (เช่น เจลลี่ +10) ทุกออเดอร์ Core`);
  if (drinkCups) ins.push(`ลดหวาน ${Math.round((drinkCups - (sweets[splitList(setting('sweetness_options', 'ปกติ,ลดหวาน'))[0]] || 0)) / drinkCups * 100)}% ของแก้วเครื่องดื่ม`);
  ins.push(`กรอกชื่อลูกค้า ${Math.round(named / bills * 100)}% ของบิล — ยิ่งสูง ข้อมูลซื้อซ้ำ/CRM ยิ่งแม่น`);

  // บิลล่าสุด (ยกเลิกได้)
  const recent = ordersAll.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).slice(0, 12);
  const recentHtml = recent.map(o => `<div class="rowl"><div><b>${esc(o.queue_no)}</b> <span class="hint">${esc(o.date)} ${esc((o.time || '').slice(0, 5))} · ${esc(payName[o.payment_method] || o.payment_method)}${o.customer_name ? ' · ' + esc(o.customer_name) : ''}</span></div><div style="display:flex;gap:8px;align-items:center"><b class="num">${baht(o.total)}</b>${o.status === 'void' ? '<span class="hint">ยกเลิกแล้ว</span>' : `<button class="btn danger sm" data-void="${esc(o.order_id)}">ยกเลิก</button>`}</div></div>`).join('');

  return `
  <div class="kpis">
    <div class="kpi ink"><div class="l">ยอดขาย</div><div class="v num">${baht(Math.round(sales))}</div><div class="h">${bills} บิล</div></div>
    <div class="kpi"><div class="l">แก้วที่ขาย</div><div class="v num">${cups}</div><div class="h">${(cups / bills).toFixed(2)} แก้ว/บิล</div></div>
    <div class="kpi"><div class="l">AOV ต่อบิล</div><div class="v num">${baht(Math.round(aov))}</div><div class="h">เป้า ${baht(target)}</div></div>
    <div class="kpi"><div class="l">Hero : Core</div><div class="v num">${tier.hero} : ${tier.core}</div><div class="h">แก้ว</div></div>
    <div class="kpi"><div class="l">กำไรส่วนเกินโดยประมาณ</div><div class="v num">${costCoverage ? baht(Math.round(grossProfit)) : '—'}</div><div class="h">มีต้นทุน snapshot ${costCoverage}/${bills} บิล</div></div>
  </div>
  ${pendingLocal ? `<div class="note">มี ${pendingLocal} ออเดอร์ที่ยังไม่ส่งเข้าชีต จึงยังไม่รวมในตัวเลขนี้</div>` : ''}
  <div class="card"><h3>ข้อสังเกตอัตโนมัติ</h3><ul class="insight">${ins.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="cols">
    <div class="card"><h3>ยอดขายรายวัน (บาท)</h3>${vbars(dayRows)}</div>
    <div class="card"><h3>จำนวนบิลรายชั่วโมง</h3>${vbars(hourRows)}</div>
    <div class="card"><h3>เมนูขายดี (แก้ว)</h3>${hbars(menuRows)}</div>
    <div class="card"><h3>ท็อปปิ้ง & ความหวาน</h3>${hbars(Object.entries(topCount).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v })), '#FFAE1A')}<div style="height:8px"></div>${hbars(Object.entries(sweets).map(([l, v]) => ({ l: 'หวาน' + l, v })), '#7B3FBF')}</div>
    <div class="card"><h3>ใครซื้อ — อายุ × เพศ (จำนวนบิล)</h3>${heat}</div>
    <div class="card"><h3>ใครซื้อ Hero เทียบ Core</h3>${segTbl}</div>
    <div class="card"><h3>วิธีชำระเงิน (บิล)</h3>${hbars(Object.entries(pay).map(([k, v]) => ({ l: payName[k] || k, v })), '#4CB944')}</div>
    <div class="card"><h3>ประสิทธิภาพโปรโมชัน</h3>${promoTable}<div class="hint">เมื่อมีข้อมูลจากเวอร์ชันนี้ ระบบจะแยกส่วนลดที่มาจากโปรออกจากส่วนลดเพิ่มเติมด้วย บิลเก่าอาจไม่มีรายละเอียดแยก</div></div>
    <div class="card"><h3>ต้นทุนและกำไร</h3><div class="rowl"><span>ต้นทุนรวมของบิลที่มี snapshot</span><b class="num">${baht(costTotal)}</b></div><div class="rowl"><span>กำไรส่วนเกินโดยประมาณ</span><b class="num">${baht(grossProfit)}</b></div><div class="hint">คำนวณจากยอดก่อนส่วนลด − ต้นทุนมาตรฐานที่ snapshot − ส่วนลดทั้งหมด; ยังไม่หักค่าเช่า ค่าแรง และค่าใช้จ่ายอื่น · บิลเก่าที่ไม่มีต้นทุนจะไม่ถูกนำมาคำนวณ</div></div>
    <div class="card"><h3>CRM: ลูกค้าซื้อซ้ำ</h3>${crmTbl}<div class="hint">นับจากชื่อที่กรอกที่หน้าร้าน ชื่อซ้ำกันอาจเป็นคนละคน ใช้เป็นแนวโน้ม</div></div>
  </div>
  <div class="card"><h3>วางแผนธุรกิจ / จุดคุ้มทุนโดยประมาณ</h3><div class="rowl"><span>ค่าใช้จ่ายดำเนินงานต่อวัน</span><b class="num">${baht(dailyFixedCost)}</b></div><div class="rowl"><span>Contribution margin จากบิลที่มีต้นทุนครบ</span><b class="num">${costCoverage && knownNetSales ? (contributionRate*100).toFixed(1)+'%' : 'ยังไม่มีข้อมูลต้นทุนครบ'}</b></div><div class="rowl"><span>ยอดขายต่อวันที่ต้องทำเพื่อคุ้มทุน</span><b class="num">${breakEvenSales ? baht(Math.ceil(breakEvenSales)) : '—'}</b></div><div class="rowl"><span>จำนวนแก้วโดยประมาณเพื่อคุ้มทุน</span><b class="num">${breakEvenCups ? breakEvenCups + ' แก้ว/วัน' : '—'}</b></div><div class="hint">เป็นค่าประมาณจากต้นทุนที่บันทึกและบิลที่มีต้นทุนครบเท่านั้น ไม่ใช่กำไรสุทธิ และยังขึ้นกับยอดขายจริง</div></div>
  <div class="card"><h3>บิลล่าสุด</h3>${recentHtml}</div>`;
}

async function loadAdminMenu() {
  const host = $('#adminMenuList'), addonHost = $('#adminAddonList');
  if (!host || !addonHost || !S.session || S.session.role !== 'admin') return;
  try {
    const r = await api('adminConfig');
    if (!r.ok) { host.innerHTML = '<div class="hint">โหลดข้อมูลไม่สำเร็จ</div>'; return; }
    host.innerHTML = r.menu.slice().sort((a,b) => a.sort-b.sort).map(m => `<div class="admin-item"><div class="admin-meta"><b>${esc(m.name)} ${m.active ? '' : '<small>(ปิดขาย)</small>'}</b><small>${esc(m.category)} · ${baht(m.price)}</small></div><div class="admin-actions"><button class="btn ghost" data-editmenu="${esc(m.id)}">แก้ไข</button><button class="btn ${m.active ? 'danger' : 'primary'}" data-togglemenu="${esc(m.id)}" data-active="${m.active ? '1' : '0'}">${m.active ? 'ปิดขาย' : 'เปิดขาย'}</button></div></div>`).join('') || '<div class="hint">ยังไม่มีเมนู</div>';
    addonHost.innerHTML = r.addons.slice().sort((a,b) => a.sort-b.sort).map(a => `<div class="admin-item"><div class="admin-meta"><b>${esc(a.name)} ${a.active ? '' : '<small>(ปิดใช้)</small>'}</b><small>${baht(a.price)}</small></div><div class="admin-actions"><button class="btn ghost" data-editaddon="${esc(a.id)}">แก้ไข</button><button class="btn ${a.active ? 'danger' : 'primary'}" data-toggleaddon="${esc(a.id)}" data-active="${a.active ? '1' : '0'}">${a.active ? 'ปิดใช้' : 'เปิดใช้'}</button></div></div>`).join('') || '<div class="hint">ยังไม่มีตัวเลือกเสริม</div>';
    const ph = $('#adminPromoList'), ch = $('#adminCostList'), eh = $('#adminExpenseList');

function startConfigPolling() {
  if (configPollTimer) clearInterval(configPollTimer);
  configPollTimer = setInterval(async () => {
    if (!S.session || !apiUrl()) return;
    try {
      const r = await api('configVersion');
      if (r.ok && knownConfigVersion !== null && Number(r.version) !== Number(knownConfigVersion)) {
        const ok = await loadConfig(true);
        if (ok) {
          renderPos();
          if (S.view === 'settings' && S.session.role === 'admin') loadAdminMenu();
          toast('เมนู/ราคามีการอัปเดตจากระบบกลาง');
        }
      }
    } catch (e) { /* network may be temporarily unavailable; keep cached config */ }
  }, 12000);
}

/* =====================================================================
   Event wiring
   ===================================================================== */
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;

  // PIN pad
  if (t.closest('#pad')) {
    if (d.k === 'del') pin = pin.slice(0, -1);
    else if (d.k === 'go') { doLogin(); return; }
    else if (pin.length < 6) pin += d.k;
    pinMsg(''); renderPin(); return;
  }
  if (t.id === 'srvBtn') {
    const v = prompt('วาง URL ของ Apps Script Web app (ลงท้ายด้วย /exec)', apiUrl());
    if (v !== null) { LS.set('eh_api', v.trim()); toast('บันทึก URL แล้ว'); } return;
  }

  // nav
  if (d.go) { show(d.go); return; }
  if (t.id === 'syncPill' || t.closest('#syncPill')) { syncQueue(); return; }
  if (t.closest('#prnPill')) { if (S.dev.mode === 'ble') { try { await connectPrinter(false); toast('เชื่อมต่อเครื่องพิมพ์แล้ว'); } catch (er) { try { await connectPrinter(true); toast('เชื่อมต่อเครื่องพิมพ์แล้ว'); } catch (er2) { toast(er2.message, true); } } } return; }

  // POS
  if (d.cat) { S.cat = d.cat; renderPos(); return; }
  if (t.classList.contains('tile')) { openSheet(S.cfg.menu.find(m => m.id === d.id)); return; }
  if (d.q) { const l = S.cart[+d.i]; l.qty += +d.q; if (l.qty <= 0) S.cart.splice(+d.i, 1); renderCart(); return; }
  if (t.id === 'cartBar') { openCart(true); return; }
  if (t.id === 'cartClose') { openCart(false); return; }
  if (t.id === 'clearCart') { if (confirm('ล้างออเดอร์ทั้งหมด?')) { S.cart = []; renderCart(); openCart(false); } return; }
  if (t.id === 'toCheckout') { openCart(false); openCheckout(); return; }

  // Sheet
  if (d.sw) { SH.sweet = d.sw; renderSheet(); return; }
  if (d.top) { SH.tops.has(d.top) ? SH.tops.delete(d.top) : SH.tops.add(d.top); renderSheet(); return; }
  if (d.sq) { SH.qty = Math.max(1, SH.qty + +d.sq); renderSheet(); return; }
  if (t.id === 'shCancel') { closeSheet(); return; }
  if (t.id === 'shAdd') { addFromSheet(); return; }

  // Checkout
  if (t.id === 'coBack') { show('pos'); return; }
  if (d.g !== undefined) { S.cust.gender = S.cust.gender === d.g ? '' : d.g; updateCheckoutTotals(); return; }
  if (d.a !== undefined) { S.cust.age = S.cust.age === d.a ? '' : d.a; updateCheckoutTotals(); return; }
  if (t.id === 'toPay') { openPay(); return; }

  // Pay
  if (t.id === 'payBack') { show('checkout'); return; }
  if (d.m) { setPayMethod(d.m); return; }
  if (d.cash) { $('#cashIn').value = d.cash; updateChange(); return; }
  if (t.id === 'confirmPay') { finalizeOrder(); return; }

  // Done
  if (t.id === 'reprint') { doPrint(S.lastOrder, false); return; }
  if (t.id === 'newOrder') { show('pos'); return; }

  // Dashboard
  if (d.pre) { S.dash.preset = d.pre; renderDash(); return; }
  if (t.id === 'dashReload') { renderDash(); return; }
  if (d.void) {
    if (!confirm('ยกเลิกบิลนี้? ข้อมูลจะถูกทำเครื่องหมาย void ในชีต (ไม่ลบ)')) return;
    try { const r = await api('voidOrder', { orderId: d.void }); toast(r.ok ? 'ยกเลิกบิลแล้ว' : 'ยกเลิกไม่สำเร็จ: ' + r.error, !r.ok); if (r.ok) renderDash(); } catch { toast('เชื่อมต่อไม่ได้', true); }
    return;
  }

  // Menu management (admin only)
  if (t.id === 'newMenu') { await editMenuRecord(); return; }
  if (t.id === 'newAddon') { await editAddonRecord(); return; }
  if (t.id === 'newPromo') { await editPromotionRecord(); return; }
  if (t.id === 'newExpense') { await editExpenseRecord(); return; }
  if (d.editexpense) { const r = await api('adminConfig'); const e = (r.expenses || []).find(x => x.id === d.editexpense); if (e) await editExpenseRecord(e); return; }
  if (d.toggleexpense) { await setExpenseActive(d.toggleexpense, d.active !== '1'); return; }
  if (d.editpromo) { const r = await api('adminConfig'); const p = (r.promotions || []).find(x => x.id === d.editpromo); if (p) await editPromotionRecord(p); return; }
  if (d.togglepromo) { await setPromotionActive(d.togglepromo, d.active !== '1'); return; }
  if (d.editcost) { await editCostRecord(d.editcost, t.dataset.costname || d.editcost, Number(t.dataset.cost || 0)); return; }
  if (d.editmenu) { const r = await api('adminConfig'); const m = r.menu && r.menu.find(x => x.id === d.editmenu); if (m) await editMenuRecord(m); return; }
  if (d.togglemenu) { await setMenuActive(d.togglemenu, d.active !== '1'); return; }
  if (d.editaddon) { const r = await api('adminConfig'); const a = r.addons && r.addons.find(x => x.id === d.editaddon); if (a) await editAddonRecord(a); return; }
  if (d.toggleaddon) { await setAddonActive(d.toggleaddon, d.active !== '1'); return; }

  // Settings
  if (d.mode) { S.dev.mode = d.mode; saveDev(); renderSettings(); updatePrinterPill(); return; }
  if (t.id === 'pickPrn') { try { await connectPrinter(true); toast('เชื่อมต่อเครื่องพิมพ์แล้ว'); renderSettings(); } catch (er) { toast(er.message, true); } return; }
  if (t.id === 'testPrn') { applySettingsInputs(); const o = { queueNo: peekQueue(), createdAt: new Date().toISOString(), customerName: 'มิ้นท์', items: [{ name: 'EH! RUBY RUSHER', sweetness: 'ลดหวาน', toppings: [], qty: 1 }, { name: 'Strawberry', sweetness: 'ปกติ', toppings: ['ครีมชีส', 'กราโนล่า'], qty: 1 }] }; await doPrint(o, false); return; }
  if (t.id === 'saveDev') { applySettingsInputs(); toast('บันทึกแล้ว'); return; }
  if (t.id === 'syncNow') { await syncQueue(); toast(LS.get('eh_queue', []).length ? 'ยังส่งไม่หมด — ตรวจอินเทอร์เน็ต/เข้าสู่ระบบ' : 'ส่งครบแล้ว', !!LS.get('eh_queue', []).length); renderSettings(); return; }
  if (t.id === 'refreshCfg') { const ok = await loadConfig(true); toast(ok ? 'อัปเดตเมนูแล้ว' : 'อัปเดตไม่สำเร็จ', !ok); return; }
  if (d.rp) { const o = LS.get('eh_recent', []).find(x => x.id === d.rp); if (o) doPrint(o, false); return; }
  if (t.id === 'logoutBtn') { if (LS.get('eh_queue', []).length && !confirm('ยังมีออเดอร์ที่ไม่ได้ส่งเข้าชีต (จะส่งต่อเมื่อเข้าสู่ระบบอีกครั้ง) ออกจากระบบ?')) return; logout(); return; }
});

function applySettingsInputs() {
  const v = id => { const el = $(id); return el ? el.value.trim() : null; };
  if (v('#stW')) S.dev.w = Number(v('#stW')) || 50;
  if (v('#stH')) S.dev.h = Number(v('#stH')) || 30;
  if (v('#stX') !== null) S.dev.offx = Number(v('#stX')) || 0;
  if (v('#stF') !== null) S.dev.feed = Math.max(0, Math.min(255, Number(v('#stF')) || 0));
  if (v('#devL')) S.dev.letter = (v('#devL').toUpperCase().replace(/[^A-Z]/g, '') || 'A');
  if (v('#devPP') !== null) S.dev.pp = v('#devPP').replace(/\D/g, '');
  if (v('#devChunk')) S.dev.chunk = Math.max(20, Number(v('#devChunk')) || 100);
  saveDev();
}

document.addEventListener('change', e => { if (e.target.id === 'promoSelect') updateCheckoutTotals(); });
document.addEventListener('input', e => {
  if (e.target.id === 'disc') updateCheckoutTotals();
  if (e.target.id === 'cashIn') updateChange();
});
document.addEventListener('keydown', e => {
  if (S.view === 'login') { if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; renderPin(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); renderPin(); } else if (e.key === 'Enter') doLogin(); }
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
});
$('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });
$('#scrim').addEventListener('click', () => openCart(false));

/* ---------- เริ่มต้น ---------- */
(async function init() {
  renderPin(); updatePrinterPill(); updateSyncPill();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (S.session && tokenExp(S.session.token) > Date.now()) {
    if (!S.cfg) await loadConfig();
    afterLogin();
    loadConfig().then(ok => { if (ok && S.view === 'pos') renderPos(); });
  } else {
    if (S.session) { S.needLogin = true; updateSyncPill(); }
    show('login');
  }
})();

</script>
</body>
