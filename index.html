function hbars(rows, color) {
  const mx = Math.max(1, ...rows.map(r => r.v));
  return rows.map(r => `<div class="hbar"><span class="lb" title="${esc(r.l)}">${esc(r.l)}</span><span class="bar"><i style="width:${Math.max(2, r.v / mx * 100)}%;background:${r.c || color || '#1A1A1A'}"></i></span><span class="num">${r.t !== undefined ? r.t : r.v}</span></div>`).join('') || '<div class="hint">ยังไม่มีข้อมูล</div>';
}
function vbars(rows) {
  const mx = Math.max(1, ...rows.map(r => r.v)), top = rows.reduce((a, r) => r.v > a.v ? r : a, { v: -1 });
  return `<div class="vbars">${rows.map(r => `<div class="c ${r === top && r.v > 0 ? 'peak' : ''}"><span class="num">${r.v ? r.v : ''}</span><i style="height:${r.v / mx * 100}%"></i><span>${esc(r.l)}</span></div>`).join('')}</div>`;
}

function dashHtml(ordersAll, itemsAll, expenses = []) {
  const N = x => Number(x) || 0;
  const orders = ordersAll.filter(o => o.status !== 'void'), items = itemsAll.filter(i => i.status !== 'void');
  const pendingLocal = LS.get('eh_queue', []).length;
  if (!orders.length) return `<div class="card">ยังไม่มียอดขายในช่วงนี้${pendingLocal ? ` (มี ${pendingLocal} ออเดอร์ที่ยังไม่ส่งเข้าชีต)` : ''}</div>`;
  const sales = orders.reduce((s, o) => s + N(o.total), 0), bills = orders.length, cups = items.reduce((s, i) => s + N(i.qty), 0), aov = sales / bills;
  const costOrders = orders.filter(o => String(o.cost_complete).toLowerCase() === 'true' && o.cost_total !== '' && o.cost_total !== undefined && Number.isFinite(Number(o.cost_total)));
  const costCoverage = costOrders.length;
  const costTotal = costOrders.reduce((n,o) => n + N(o.cost_total), 0);
  const grossProfit = costOrders.reduce((n,o) => n + N(o.gross_profit), 0);
  const dailyFixedCost = expenses.reduce((n,e) => n + N(e.amount) / (e.period === 'monthly' ? 30.4 : 1), 0);
  const knownNetSales = costOrders.reduce((n,o) => n + N(o.total), 0);
  const contributionRate = knownNetSales > 0 ? grossProfit / knownNetSales : 0;
  const knownCups = costOrders.reduce((n,o) => n + N(o.cups), 0);
  const avgContributionPerCup = knownCups > 0 ? grossProfit / knownCups : 0;
  const breakEvenSales = contributionRate > 0 ? dailyFixedCost / contributionRate : 0;
  const breakEvenCups = avgContributionPerCup > 0 ? Math.ceil(dailyFixedCost / avgContributionPerCup) : 0;
  const promoMap = {}; orders.filter(o => o.promo_id || o.promo_name).forEach(o => { const k = o.promo_id || o.promo_name; const p = promoMap[k] = promoMap[k] || { name:o.promo_name || o.promo_id, count:0, sales:0, discount:0 }; p.count++; p.sales += N(o.total); p.discount += N(o.promo_discount !== undefined && o.promo_discount !== '' ? o.promo_discount : o.discount); });
  const promoRows = Object.values(promoMap).sort((a,b) => b.count-a.count);
  const promoTable = promoRows.length ? `<table class="tbl"><tr><th>โปรโมชัน</th><th>บิล</th><th>ยอดสุทธิ</th><th>ส่วนลด</th></tr>${promoRows.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${p.count}</td><td class="num">${baht(p.sales)}</td><td class="num">${baht(p.discount)}</td></tr>`).join('')}</table>` : '<div class="hint">ยังไม่มีการใช้โปรโมชันในช่วงนี้</div>';
  const target = N(setting('aov_target', 80));
  const menuColor = {}; (S.cfg ? S.cfg.menu : []).forEach(m => menuColor[m.id] = m.color);

  // เมนูขายดี
  const menuName = {}; (S.cfg ? S.cfg.menu : []).forEach(m => menuName[m.id] = m.name);
  const byMenu = {}; items.forEach(i => { const k = i.menu_id || i.item_name; (byMenu[k] = byMenu[k] || { l: menuName[k] || i.item_name, v: 0, c: menuColor[k], tier: i.tier }).v += N(i.qty); });
  const menuRows = Object.values(byMenu).sort((a, b) => b.v - a.v);
  // ชั่วโมง / วัน
  const hrs = {}; orders.forEach(o => { hrs[N(o.hour)] = (hrs[N(o.hour)] || 0) + 1; });
  const hKeys = Object.keys(hrs).map(Number), hMin = Math.min(...hKeys), hMax = Math.max(...hKeys);
  const hourRows = []; for (let h = hMin; h <= hMax; h++) hourRows.push({ l: pad(h), v: hrs[h] || 0 });
  const days = {}; orders.forEach(o => { days[o.date] = (days[o.date] || 0) + N(o.total); });
  let dayRows = Object.keys(days).sort().map(d => ({ l: d.slice(5), v: Math.round(days[d]) }));
  const byMonth = dayRows.length > 31; if (byMonth) { const mo = {}; Object.keys(days).forEach(d => mo[d.slice(0, 7)] = (mo[d.slice(0, 7)] || 0) + days[d]); dayRows = Object.keys(mo).sort().map(m => ({ l: m.slice(2).replace('-', '/'), v: Math.round(mo[m]) })); }
  // Hero/Core, add-on, หวาน
  const tier = { hero: 0, core: 0, other: 0 }; items.forEach(i => tier[i.tier] = (tier[i.tier] || 0) + N(i.qty));
  const coreItems = items.filter(i => i.tier === 'core'), coreCups = coreItems.reduce((s, i) => s + N(i.qty), 0);
  const coreTop = coreItems.filter(i => i.toppings).reduce((s, i) => s + N(i.qty), 0);
  const topCount = {}; items.forEach(i => (i.toppings || '').split(',').map(x => x.trim()).filter(Boolean).forEach(t => topCount[t] = (topCount[t] || 0) + N(i.qty)));
  const sweets = {}; items.filter(i => i.sweetness).forEach(i => sweets[i.sweetness] = (sweets[i.sweetness] || 0) + N(i.qty));
  const drinkCups = Object.values(sweets).reduce((a, b) => a + b, 0);
  const pay = {}; orders.forEach(o => pay[o.payment_method] = (pay[o.payment_method] || 0) + 1);
  const payName = { promptpay: 'QR พร้อมเพย์', cash: 'เงินสด' };

  // กลุ่มลูกค้า
  const gOpts = splitList(setting('gender_options', 'หญิง,ชาย,ไม่ระบุ')), aOpts = splitList(setting('age_options', 'ต่ำกว่า 18,18-24,25-34,35-44,45+'));
  const cell = {}; orders.forEach(o => { const k = (o.age_range || '—') + '|' + (o.gender || '—'); cell[k] = (cell[k] || 0) + 1; });
  const aAll = [...aOpts, '—'], gAll = [...gOpts, '—'], maxCell = Math.max(1, ...Object.values(cell));
  const heat = `<table class="tbl"><tr><th>อายุ \\ เพศ</th>${gAll.map(g => `<th>${g === '—' ? 'ไม่ได้เลือก' : esc(g)}</th>`).join('')}</tr>${aAll.map(a => `<tr><td>${a === '—' ? 'ไม่ได้เลือก' : esc(a)}</td>${gAll.map(g => { const v = cell[a + '|' + g] || 0; return `<td class="num" style="background:rgba(255,174,26,${(v / maxCell * 0.85).toFixed(2)})">${v || ''}</td>`; }).join('')}</tr>`).join('')}</table>`;
  const seg = {}; items.forEach(i => { const a = i.age_range || '—'; const o = seg[a] = seg[a] || { hero: 0, core: 0 }; if (i.tier === 'hero') o.hero += N(i.qty); else if (i.tier === 'core') o.core += N(i.qty); });
  const segTbl = `<table class="tbl"><tr><th>อายุ</th><th>Hero</th><th>Core</th><th>% Hero</th></tr>${aAll.filter(a => seg[a]).map(a => { const o = seg[a], t = o.hero + o.core; return `<tr><td>${a === '—' ? 'ไม่ได้เลือก' : esc(a)}</td><td class="num">${o.hero}</td><td class="num">${o.core}</td><td class="num">${t ? Math.round(o.hero / t * 100) + '%' : '-'}</td></tr>`; }).join('')}</table>`;

  // CRM: ลูกค้าที่กลับมาซื้อซ้ำ (อิงชื่อที่กรอก — ใช้เป็นแนวโน้ม)
  const cust = {}; orders.filter(o => o.customer_name).forEach(o => { const k = o.customer_name.trim().toLowerCase(); const c = cust[k] = cust[k] || { name: o.customer_name.trim(), n: 0, spend: 0, last: '', fav: {} }; c.n++; c.spend += N(o.total); if (o.date > c.last) c.last = o.date; });
  items.filter(i => i.customer_name).forEach(i => { const c = cust[i.customer_name.trim().toLowerCase()]; if (c) c.fav[i.item_name] = (c.fav[i.item_name] || 0) + N(i.qty); });
  const repeaters = Object.values(cust).filter(c => c.n >= 2).sort((a, b) => b.n - a.n || b.spend - a.spend).slice(0, 10);
  const named = orders.filter(o => o.customer_name).length;
  const crmTbl = repeaters.length ? `<table class="tbl"><tr><th>ชื่อ</th><th>ครั้ง</th><th>ยอดรวม</th><th>ชอบ</th></tr>${repeaters.map(c => `<tr><td>${esc(c.name)}</td><td class="num">${c.n}</td><td class="num">${baht(c.spend)}</td><td>${esc(Object.entries(c.fav).sort((a, b) => b[1] - a[1])[0]?.[0] || '')}</td></tr>`).join('')}</table>` : '<div class="hint">ยังไม่มีชื่อที่ซื้อซ้ำในช่วงนี้ (ต้องเลือกช่วง “ทั้งหมด” หรือเก็บชื่อให้ได้มากขึ้น)</div>';

  // Insight
  const ins = [];
  const bestH = hourRows.reduce((a, r) => r.v > a.v ? r : a, { v: -1 });
  ins.push(`ช่วงขายดีที่สุดคือ ${bestH.l}:00–${bestH.l}:59 น. (${bestH.v} บิล) — จัดคนและเตรียมของให้พร้อมก่อนช่วงนี้`);
  if (menuRows.length) ins.push(`ขายดีที่สุด: ${menuRows[0].l} (${menuRows[0].v} แก้ว)${menuRows.length > 1 ? ` · ขายน้อยที่สุด: ${menuRows[menuRows.length - 1].l} (${menuRows[menuRows.length - 1].v})` : ''}`);
  const heroPct = (tier.hero + tier.core) ? Math.round(tier.hero / (tier.hero + tier.core) * 100) : 0;
  ins.push(`AOV ${baht(aov.toFixed(0))} ${aov >= target ? 'ถึง' : 'ยังไม่ถึง'}เป้า ${baht(target)} ตามแผน · สัดส่วน Hero ${heroPct}% ของแก้ว Smoothie`);
  if (coreCups) ins.push(`Core ที่เพิ่มท็อปปิ้ง ${Math.round(coreTop / coreCups * 100)}% — ถ้าต่ำ ลองให้พนักงานเสนอท็อปปิ้งตัวเดียว (เช่น เจลลี่ +10) ทุกออเดอร์ Core`);
  if (drinkCups) ins.push(`ลดหวาน ${Math.round((drinkCups - (sweets[splitList(setting('sweetness_options', 'ปกติ,ลดหวาน'))[0]] || 0)) / drinkCups * 100)}% ของแก้วเครื่องดื่ม`);
  ins.push(`กรอกชื่อลูกค้า ${Math.round(named / bills * 100)}% ของบิล — ยิ่งสูง ข้อมูลซื้อซ้ำ/CRM ยิ่งแม่น`);

  // บิลล่าสุด (ยกเลิกได้)
  const recent = ordersAll.slice().sort((a, b) => (b.created_at || '').localeCompare(a.created_at || '')).slice(0, 12);
  const recentHtml = recent.map(o => `<div class="rowl"><div><b>${esc(o.queue_no)}</b> <span class="hint">${esc(o.date)} ${esc((o.time || '').slice(0, 5))} · ${esc(payName[o.payment_method] || o.payment_method)}${o.customer_name ? ' · ' + esc(o.customer_name) : ''}</span></div><div style="display:flex;gap:8px;align-items:center"><b class="num">${baht(o.total)}</b>${o.status === 'void' ? '<span class="hint">ยกเลิกแล้ว</span>' : `<button class="btn danger sm" data-void="${esc(o.order_id)}">ยกเลิก</button>`}</div></div>`).join('');

  return `
  <div class="kpis">
    <div class="kpi ink"><div class="l">ยอดขาย</div><div class="v num">${baht(Math.round(sales))}</div><div class="h">${bills} บิล</div></div>
    <div class="kpi"><div class="l">แก้ว/ชิ้นที่ขาย</div><div class="v num">${cups}</div><div class="h">${(cups / bills).toFixed(2)} แก้ว/บิล</div></div>
    <div class="kpi"><div class="l">AOV ต่อบิล</div><div class="v num">${baht(Math.round(aov))}</div><div class="h">เป้า ${baht(target)}</div></div>
    <div class="kpi"><div class="l">Hero : Core</div><div class="v num">${tier.hero} : ${tier.core}</div><div class="h">แก้ว</div></div>
    <div class="kpi"><div class="l">กำไรส่วนเกินโดยประมาณ</div><div class="v num">${costCoverage ? baht(Math.round(grossProfit)) : '—'}</div><div class="h">มีต้นทุน snapshot ${costCoverage}/${bills} บิล</div></div>
  </div>
  ${pendingLocal ? `<div class="note">มี ${pendingLocal} ออเดอร์ที่ยังไม่ส่งเข้าชีต จึงยังไม่รวมในตัวเลขนี้</div>` : ''}
  <div class="card"><h3>ข้อสังเกตอัตโนมัติ</h3><ul class="insight">${ins.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
  <div class="cols">
    <div class="card"><h3>${byMonth ? 'ยอดขายรายเดือน (บาท)' : 'ยอดขายรายวัน (บาท)'}</h3>${vbars(dayRows)}</div>
    <div class="card"><h3>จำนวนบิลรายชั่วโมง</h3>${vbars(hourRows)}</div>
    <div class="card"><h3>เมนูขายดี (แก้ว)</h3>${hbars(menuRows)}</div>
    <div class="card"><h3>ท็อปปิ้ง & ความหวาน</h3>${hbars(Object.entries(topCount).sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v })), '#FFAE1A')}<div style="height:8px"></div>${hbars(Object.entries(sweets).map(([l, v]) => ({ l: sweetLabel(l), v })), '#7B3FBF')}</div>
    <div class="card"><h3>ใครซื้อ — อายุ × เพศ (จำนวนบิล)</h3>${heat}</div>
    <div class="card"><h3>ใครซื้อ Hero เทียบ Core</h3>${segTbl}</div>
    <div class="card"><h3>วิธีชำระเงิน (บิล)</h3>${hbars(Object.entries(pay).map(([k, v]) => ({ l: payName[k] || k, v })), '#4CB944')}</div>
    <div class="card"><h3>ประสิทธิภาพโปรโมชัน</h3>${promoTable}<div class="hint">เมื่อมีข้อมูลจากเวอร์ชันนี้ ระบบจะแยกส่วนลดที่มาจากโปรออกจากส่วนลดเพิ่มเติมด้วย บิลเก่าอาจไม่มีรายละเอียดแยก</div></div>
    <div class="card"><h3>ต้นทุนและกำไร</h3><div class="rowl"><span>ต้นทุนรวมของบิลที่มี snapshot</span><b class="num">${baht(costTotal)}</b></div><div class="rowl"><span>กำไรส่วนเกินโดยประมาณ</span><b class="num">${baht(grossProfit)}</b></div><div class="hint">คำนวณจากยอดก่อนส่วนลด − ต้นทุนมาตรฐานที่ snapshot − ส่วนลดทั้งหมด; ยังไม่หักค่าเช่า ค่าแรง และค่าใช้จ่ายอื่น · บิลเก่าที่ไม่มีต้นทุนจะไม่ถูกนำมาคำนวณ</div></div>
    <div class="card"><h3>CRM: ลูกค้าซื้อซ้ำ</h3>${crmTbl}<div class="hint">นับจากชื่อที่กรอกที่หน้าร้าน ชื่อซ้ำกันอาจเป็นคนละคน ใช้เป็นแนวโน้ม</div></div>
  </div>
  <div class="card"><h3>วางแผนธุรกิจ / จุดคุ้มทุนโดยประมาณ</h3><div class="rowl"><span>ค่าใช้จ่ายดำเนินงานต่อวัน</span><b class="num">${baht(dailyFixedCost)}</b></div><div class="rowl"><span>Contribution margin จากบิลที่มีต้นทุนครบ</span><b class="num">${costCoverage && knownNetSales ? (contributionRate*100).toFixed(1)+'%' : 'ยังไม่มีข้อมูลต้นทุนครบ'}</b></div><div class="rowl"><span>ยอดขายต่อวันที่ต้องทำเพื่อคุ้มทุน</span><b class="num">${breakEvenSales ? baht(Math.ceil(breakEvenSales)) : '—'}</b></div><div class="rowl"><span>จำนวนแก้วโดยประมาณเพื่อคุ้มทุน</span><b class="num">${breakEvenCups ? breakEvenCups + ' แก้ว/วัน' : '—'}</b></div><div class="hint">เป็นค่าประมาณจากต้นทุนที่บันทึกและบิลที่มีต้นทุนครบเท่านั้น ไม่ใช่กำไรสุทธิ และยังขึ้นกับยอดขายจริง</div></div>
  <div class="card"><h3>บิลล่าสุด</h3>${recentHtml}</div>`;
}

const PALETTE = [['Berry', '#E5365B'], ['Yolk', '#FFAE1A'], ['Orange', '#F26B2A'], ['Lime', '#4CB944'], ['Teal', '#1FA597'], ['Sky', '#3A8DE0'], ['Grape', '#7B3FBF'], ['Mocha', '#8B5A3C']];
let MF = null;
const rn = v => { const n = Number(String(v ?? '').replace(/[,\s฿]/g, '')); return Number.isFinite(n) && n > 0 ? n : 0; };   // รับ "1,000" / "฿120"
const recipeCost = lines => lines.reduce((s, l) => s + (rn(l.buyQty) > 0 ? rn(l.buyPrice) / rn(l.buyQty) * rn(l.useQty) : 0), 0);
const THB2 = n => '฿' + Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

async function imageToData(file) {
  const bmp = await createImageBitmap(file), S2 = 280, c = document.createElement('canvas'); c.width = c.height = S2;
  const g = c.getContext('2d'), s = Math.min(bmp.width, bmp.height); g.drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, S2, S2);
  let q = 0.78, u; do { u = c.toDataURL('image/jpeg', q); q -= 0.08; } while (u.length > 40000 && q > 0.3);
  if (u.length > 44000) throw new Error('รูปใหญ่เกินไป ลองรูปอื่น');
  return u;
}
function mfRecipeHtml() {
  return MF.recipe.map((l, i) => `<div class="rrow" data-ri="${i}">
    <div class="rtop"><input class="inp" data-rf="name" placeholder="วัตถุดิบ เช่น ไซรัป" value="${esc(l.name || '')}"><button type="button" class="btn ghost sm" data-mf="rdel" data-i="${i}" aria-label="ลบ" style="width:46px;padding:0">✕</button></div>
    <div class="row3"><input class="inp num" data-rf="buyQty" inputmode="decimal" placeholder="ซื้อมา" value="${esc(l.buyQty ?? '')}"><input class="inp" data-rf="unit" placeholder="หน่วย" value="${esc(l.unit || '')}"><input class="inp num" data-rf="buyPrice" inputmode="decimal" placeholder="ราคา ฿" value="${esc(l.buyPrice ?? '')}"></div>
    <div class="rcalc" id="rc${i}"></div>
    <div class="rtop"><span class="hint">ใช้ต่อแก้ว (${esc(l.unit || 'หน่วย')})</span><input class="inp num" data-rf="useQty" inputmode="decimal" placeholder="0" value="${esc(l.useQty ?? '')}" style="max-width:130px"></div></div>`).join('') || '<div class="hint">ยังไม่มีวัตถุดิบ — กด “+ เพิ่มวัตถุดิบ” หรือกรอกต้นทุนรวมเองด้านล่าง</div>';
}
function mfUpdate() {
  const price = numIn('mfPrice', 0), hasR = MF.recipe.length > 0;
  MF.recipe.forEach((l, i) => { const el = $('#rc' + i); if (!el) return; const per = rn(l.buyQty) > 0 ? rn(l.buyPrice) / rn(l.buyQty) : 0; el.textContent = rn(l.buyQty) ? `ซื้อ ${rn(l.buyQty)} ${l.unit || ''} ราคา ${baht(rn(l.buyPrice))} → ${'฿' + per.toFixed(3)} ต่อ${l.unit || 'หน่วย'} · ต้นทุนในแก้ว ${THB2(per * rn(l.useQty))}` : 'กรอกจำนวนที่ซื้อมา (มากกว่า 0) เพื่อคำนวณ'; });
  const cost = hasR ? recipeCost(MF.recipe) : numIn('mfManual', MF.cur), profit = price - cost, mg = price > 0 ? profit / price * 100 : 0;
  const mc = $('#mfManualWrap'); if (mc) mc.hidden = hasR;
  $('#mfCost').textContent = THB2(cost); $('#mfProfit').textContent = THB2(profit); $('#mfMargin').textContent = price > 0 ? mg.toFixed(0) + '%' : '—';
  const pv = $('#mfPrev'); if (pv) {
    pv.style.setProperty('--c', MF.color); pv.style.setProperty('--fg', fgFor(MF.color));
    pv.querySelector('.art').innerHTML = MF.image ? `<img src="${MF.image}" alt="">` : esc(monogram(valIn('mfName') || 'EH'));
    pv.querySelector('.nm').textContent = valIn('mfName') || 'ชื่อเมนู'; pv.querySelector('.pr').textContent = baht(price);
  }
  $$('#sheet [data-mf="color"]').forEach(b => b.classList.toggle('on', b.dataset.v === MF.color));
  const ri = $('#mfImgBtn'); if (ri) ri.textContent = MF.image ? 'เปลี่ยนรูป' : '📷 เพิ่มรูป'; const rd = $('#mfImgDel'); if (rd) rd.hidden = !MF.image;
}
async function editMenuRecord(existing = null) {
  let costs = [], cats = categories();
  try { const r = await api('adminConfig'); if (r.ok) { costs = r.costs || []; cats = [...new Set(r.menu.map(x => x.category).filter(Boolean))]; } else if (r.error) { toast(errMsg(r), true); return; } } catch { toast('เชื่อมต่อระบบกลางไม่ได้', true); return; }
  const m = existing || { id: '', category: cats[0] || 'Smoothie', name: '', sub: '', price: 69, color: '#FFAE1A', tier: 'core', isDrink: true, allowAddons: true, active: true, sort: 999, image: '', recipe: '' };
  const mid = m.id || 'M' + rid() + rid();
  let recipe = []; try { recipe = JSON.parse(m.recipe || '[]'); if (!Array.isArray(recipe)) recipe = []; } catch { recipe = []; }
  const cur = Number((costs.find(c => String(c.menuId) === String(m.id)) || {}).unitCost) || 0;
  MF = { recipe, image: safeImg(m.image), color: safeColor(m.color), cur, isDrink: !!m.isDrink, allowAddons: !!m.allowAddons };
  openForm({
    title: m.id ? 'แก้ไขเมนู' : 'เพิ่มเมนูใหม่', sub: 'ตัวอย่างการ์ดในหน้าขายอัปเดตสดด้านล่าง', saveText: 'บันทึกเมนู',
    footer: `<div class="msum"><div><small>ต้นทุน/แก้ว</small><b id="mfCost">฿0.00</b></div><div><small>กำไร/แก้ว</small><b id="mfProfit">฿0.00</b></div><div><small>Margin</small><b id="mfMargin">—</b></div></div>`,
    html: `<div class="mfhead"><div class="tile prev" id="mfPrev" style="pointer-events:none"><div class="art"></div><div class="info"><div><div class="nm"></div><div class="pr num"></div></div></div></div>
      <div style="display:grid;gap:8px;align-content:start"><input type="file" id="mfFile" accept="image/*" hidden><button type="button" class="btn ghost sm" id="mfImgBtn" data-mf="img"></button><button type="button" class="btn ghost sm" id="mfImgDel" data-mf="imgdel">ลบรูป</button><div class="hint">ไม่มีรูป ระบบใช้สีประจำเมนูแทน</div></div></div>
      ${'<div class="field"><label>ชื่อเมนู</label><input class="inp" id="mfName" maxlength="60" value="' + esc(m.name) + '"></div>'}
      <div class="row2"><div class="field"><label>หมวด</label><input class="inp" id="mfCat" list="mfCats" maxlength="40" value="${esc(m.category)}"><datalist id="mfCats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist></div>
      <div class="field"><label>ราคาขาย (บาท)</label><div class="pstep"><button type="button" data-mf="pm" data-d="-1">−</button><input class="inp num" id="mfPrice" inputmode="decimal" value="${Number(m.price) || 0}"><button type="button" data-mf="pm" data-d="1">+</button></div></div></div>
      <div class="field"><label>คำอธิบายสั้น ๆ (ไม่บังคับ)</label><input class="inp" id="mfSub" maxlength="120" value="${esc(m.sub || '')}"></div>
      <div class="field"><label>สีประจำเมนู · ใช้ในหน้าขาย ตะกร้า และกราฟสรุปยอด</label><div class="swatches">${PALETTE.map(p => `<button type="button" class="swb" data-mf="color" data-v="${p[1]}" title="${p[0]}" aria-label="${p[0]}" style="--c:${p[1]}"></button>`).join('')}</div></div>
      <div class="field"><label>ประเภท (ใช้ในแดชบอร์ด)</label>${seg2('tier', [['hero', 'Hero'], ['core', 'Core'], ['other', 'อื่นๆ']], ['hero', 'core', 'other'].includes(m.tier) ? m.tier : 'other')}</div>
      <div class="seg"><button type="button" class="chip ${MF.isDrink ? 'on' : ''}" data-mf="tog" data-k="isDrink">เป็นเครื่องดื่ม (ถามความหวาน)</button><button type="button" class="chip ${MF.allowAddons ? 'on' : ''}" data-mf="tog" data-k="allowAddons">เลือกท็อปปิงได้</button></div>
      <div class="card" style="box-shadow:none;background:#FBF9F4"><h3>สูตรต้นทุนต่อแก้ว</h3><div id="mfRecipe" style="display:grid;gap:10px">${mfRecipeHtml()}</div>
        <button type="button" class="btn ghost sm" data-mf="radd">+ เพิ่มวัตถุดิบ</button>
        <div class="field" id="mfManualWrap"><label>หรือกรอกต้นทุนรวมต่อแก้วเอง (บาท)</label><input class="inp num" id="mfManual" inputmode="decimal" value="${cur || ''}" placeholder="0"></div></div>`,
    onOpen: mfUpdate,
    onSave: async () => {
      const name = valIn('mfName'); if (!name) { toast('กรุณาระบุชื่อเมนู', true); return false; }
      const price = numIn('mfPrice', NaN); if (!Number.isFinite(price) || price < 0 || price > 100000) { toast('ราคาไม่ถูกต้อง', true); return false; }
      const lines = MF.recipe.filter(l => String(l.name || '').trim() || rn(l.buyPrice) || rn(l.useQty)).map(l => ({ name: String(l.name || '').trim(), buyQty: rn(l.buyQty), unit: String(l.unit || '').trim(), buyPrice: rn(l.buyPrice), useQty: rn(l.useQty) }));
      const badLine = lines.find(l => l.name && (!l.buyQty || !l.useQty)); if (badLine) { toast(`วัตถุดิบ “${badLine.name}” ยังกรอกจำนวนซื้อ/ใช้ต่อแก้วไม่ครบ`, true); return false; }
      const cost = round2(lines.length ? recipeCost(lines) : numIn('mfManual', MF.cur));
      let r; try { r = await api('saveMenu', { menu: { ...m, id: mid, name, price, category: valIn('mfCat') || 'เมนูทั่วไป', sub: valIn('mfSub'), color: MF.color, tier: segVal('tier') || 'other', isDrink: MF.isDrink, allowAddons: MF.allowAddons, image: MF.image, recipe: lines.length ? JSON.stringify(lines) : '', active: m.id ? m.active : true } }); } catch { toast('เชื่อมต่อไม่ได้ จึงยังไม่ได้ยืนยันการบันทึก', true); return false; }
      if (!r.ok) { toast('บันทึกเมนูไม่สำเร็จ: ' + errMsg(r), true); return false; }
      const id = r.id || m.id;
      if (Math.abs(cost - MF.cur) > 0.0049 && (cost > 0 || MF.cur > 0)) { try { await api('saveCost', { cost: { menuId: id, unitCost: cost, note: lines.length ? 'จากสูตรต้นทุน' : 'กรอกเอง' } }); } catch { toast('บันทึกเมนูแล้ว แต่บันทึกต้นทุนไม่สำเร็จ', true); } }
      await loadConfig(true); await loadAdminMenu(); renderPos(); toast('บันทึกเมนูแล้ว'); return true;
    }
  });
}
$('#sheet').addEventListener('click', async e => {
  if (!MF || !FORM) return; const b = e.target.closest('[data-mf]'); if (!b) return; const k = b.dataset.mf;
  if (k === 'color') { MF.color = b.dataset.v; mfUpdate(); }
  else if (k === 'tog') { MF[b.dataset.k] = !MF[b.dataset.k]; b.classList.toggle('on', MF[b.dataset.k]); }
  else if (k === 'pm') { const i = $('#mfPrice'); i.value = Math.max(0, numIn('mfPrice', 0) + Number(b.dataset.d)); mfUpdate(); }
  else if (k === 'radd') { MF.recipe.push({ name: '', buyQty: '', unit: '', buyPrice: '', useQty: '' }); $('#mfRecipe').innerHTML = mfRecipeHtml(); mfUpdate(); }
  else if (k === 'rdel') { MF.recipe.splice(Number(b.dataset.i), 1); $('#mfRecipe').innerHTML = mfRecipeHtml(); mfUpdate(); }
  else if (k === 'img') { $('#mfFile').click(); }
  else if (k === 'imgdel') { MF.image = ''; mfUpdate(); }
});
$('#sheet').addEventListener('change', async e => {
  if (!MF || !FORM || e.target.id !== 'mfFile') return; const f = e.target.files && e.target.files[0]; if (!f) return;
  try { MF.image = await imageToData(f); mfUpdate(); } catch (er) { toast(er.message || 'อ่านรูปไม่สำเร็จ', true); } e.target.value = '';
});
$('#sheet').addEventListener('input', e => {
  if (!MF || !FORM) return; const t = e.target;
  if (t.dataset.rf) { const row = t.closest('[data-ri]'), l = MF.recipe[Number(row.dataset.ri)]; if (l) { l[t.dataset.rf] = t.value; if (t.dataset.rf === 'unit') { const h = row.querySelector('.rtop .hint'); if (h) h.textContent = `ใช้ต่อแก้ว (${t.value || 'หน่วย'})`; } } mfUpdate(); }
  else if (['mfName', 'mfPrice', 'mfManual'].includes(t.id)) mfUpdate();
});

async function editAddonRecord(existing = null) {
  let costs = []; try { const r = await api('adminConfig'); if (r.ok) costs = r.costs || []; else if (r.error) { toast(errMsg(r), true); return; } } catch { toast('เชื่อมต่อระบบกลางไม่ได้', true); return; }
  const a = existing || { id: '', name: '', price: 10, active: true, sort: 999 };
  const aid = a.id || 'A' + rid() + rid();
  const cur = Number((costs.find(c => String(c.menuId) === 'addon:' + a.id) || {}).unitCost) || 0;
  openForm({
    title: a.id ? 'แก้ไขท็อปปิง' : 'เพิ่มท็อปปิง / ตัวเลือกเสริม', saveText: 'บันทึก',
    html: `<div class="field"><label>ชื่อ</label><input class="inp" id="adName" maxlength="40" value="${esc(a.name)}"></div>
      <div class="row2"><div class="field"><label>ราคาเพิ่ม (บาท)</label><input class="inp num" id="adPrice" inputmode="decimal" value="${Number(a.price) || 0}"></div>
      <div class="field"><label>ต้นทุน/หน่วย (บาท)</label><input class="inp num" id="adCost" inputmode="decimal" value="${cur || ''}" placeholder="0"></div></div>`,
    onSave: async () => {
      const name = valIn('adName'); if (!name) { toast('กรุณาระบุชื่อ', true); return false; }
      const price = numIn('adPrice', NaN); if (!Number.isFinite(price) || price < 0) { toast('ราคาไม่ถูกต้อง', true); return false; }
      const cost = round2(numIn('adCost', 0));
      let r; try { r = await api('saveAddon', { addon: { ...a, id: aid, name, price, active: a.id ? a.active : true } }); } catch { toast('เชื่อมต่อไม่ได้', true); return false; }
      if (!r.ok) { toast('บันทึกไม่สำเร็จ: ' + errMsg(r), true); return false; }
      const id = r.id || a.id;
      if (id && Math.abs(cost - cur) > 0.0049) { try { await api('saveCost', { cost: { menuId: 'addon:' + id, unitCost: cost, note: 'กรอกเอง' } }); } catch { } }
      await loadConfig(true); await loadAdminMenu(); renderPos(); toast('บันทึกแล้ว'); return true;
    }
  });
}

async function editPromotionRecord(existing = null) {
  let menus = []; try { const r = await api('adminConfig'); if (r.ok) menus = r.menu.filter(x => x.active); else if (r.error) { toast(errMsg(r), true); return; } } catch { toast('เชื่อมต่อระบบกลางไม่ได้', true); return; }

  openForm({
    title: p.id ? 'แก้ไขโปรโมชัน' : 'สร้างโปรโมชัน', saveText: 'บันทึกโปรโมชัน',

      const name = valIn('prName'); if (!name) { toast('กรุณาระบุชื่อโปรโมชัน', true); return false; }
      const type = segVal('ptype') || 'fixed', value = numIn('prVal', NaN);
      if (!Number.isFinite(value) || value <= 0 || (type === 'percent' && value > 100)) { toast('มูลค่าส่วนลดไม่ถูกต้อง', true); return false; }
      const minQty = Math.max(1, Math.floor(numIn('prMin', 1))), startDate = valIn('prStart'), endDate = valIn('prEnd');
      if (startDate && endDate && startDate > endDate) { toast('วันเริ่มต้องไม่เกินวันสิ้นสุด', true); return false; }
      const eligibleMenuIds = $$('#prMenus .chip.on').map(b => b.dataset.pm).join(',');
      let r; try { r = await api('savePromotion', { promotion: { ...p, id: pid, name, type, value, minQty, startDate, endDate, eligibleMenuIds, active: p.id ? p.active : true } }); } catch { toast('เชื่อมต่อไม่ได้', true); return false; }

      await loadConfig(true); await loadAdminMenu(); toast('บันทึกโปรโมชันแล้ว'); return true;

  });
}

async function editCostRecord(id, name, current) {
  openForm({
    title: 'ตั้งต้นทุน', sub: name, saveText: 'บันทึกต้นทุน',
    html: `<div class="field"><label>ต้นทุนต่อหน่วย (บาท)</label><input class="inp num" id="csVal" inputmode="decimal" value="${Number(current) || ''}" placeholder="0"></div>

      <div class="hint">ประวัติต้นทุนถูกเก็บไว้ ออเดอร์เก่าไม่เปลี่ยนตามต้นทุนใหม่</div>`,
    onSave: async () => {
      const unitCost = numIn('csVal', NaN); if (!Number.isFinite(unitCost) || unitCost < 0) { toast('ต้นทุนไม่ถูกต้อง', true); return false; }
      let r; try { r = await api('saveCost', { cost: { menuId: id, unitCost: round2(unitCost), note: valIn('csNote') } }); } catch { toast('เชื่อมต่อไม่ได้', true); return false; }
      if (!r.ok) { toast('บันทึกไม่สำเร็จ: ' + errMsg(r), true); return false; }
      await loadConfig(true); await loadAdminMenu(); toast('บันทึกต้นทุนแล้ว'); return true;
    }
  });
}

/* ---------- การชำระเงิน (พร้อมเพย์ + ชื่อบัญชี + ทดสอบ QR ฿1) ---------- */
function ppValid(id) { return /^\d{10}$|^\d{13}$|^\d{15}$/.test(id); }
function ppHint() {
  const el = $('#ppId'), h = $('#ppHint'); if (!el || !h) return; const v = el.value.replace(/\D/g, '');
  h.className = 'hint ' + (!v ? '' : ppValid(v) ? 'okt' : 'badt');
  h.textContent = !v ? 'กรอกเบอร์โทร 10 หลัก / เลขบัตร 13 หลัก / e-Wallet 15 หลัก' : ppValid(v) ? `✓ รูปแบบถูกต้อง (${v.length} หลัก) · ใช้กับทุกเครื่อง` : `รูปแบบยังไม่ถูกต้อง (${v.length} หลัก)`;
}
async function savePaymentSettings() {
  const id = ($('#ppId').value || '').replace(/\D/g, ''), name = ($('#ppName').value || '').trim();
  if (id && !ppValid(id)) { toast('เลขพร้อมเพย์ไม่ถูกต้อง', true); return; }
  try {
    for (const [key, value] of [['promptpay_id', id], ['promptpay_name', name]]) {
      const r = await api('saveSetting', { key, value }); if (!r.ok) throw new Error(errMsg(r));
      S.cfg = S.cfg || { menu: [], addons: [], settings: {} }; S.cfg.settings = S.cfg.settings || {}; S.cfg.settings[key] = value;
    }
    LS.set('eh_cfg', S.cfg); toast('บันทึกการชำระเงินแล้ว');
  } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, true); }
}
function testQr1() {
  const id = (($('#ppId') && $('#ppId').value) || ppId() || '').replace(/\D/g, ''), payload = ppValid(id) ? promptPayPayload(id, 1) : null;
  if (!payload) { toast('กรอกเลขพร้อมเพย์ให้ถูกต้องก่อน', true); return; }
  const qr = qrcode(0, 'M'); qr.addData(payload); qr.make(); const nm = (($('#ppName') && $('#ppName').value) || setting('promptpay_name', '')).trim();
  openForm({ title: 'ทดสอบ QR ฿1', sub: 'สแกนด้วยแอปธนาคาร เช็กว่าเลขและชื่อบัญชีตรงกับของร้าน', saveText: 'ปิด', onSave: async () => true,
    html: `<div class="qrbox"><div class="qr-amt num" style="display:block">฿1</div><img alt="QR ทดสอบ" src="${qr.createDataURL(8, 2)}">${nm ? `<div class="qr-name">${esc(nm)}</div>` : ''}<div class="hint">ไม่ต้องโอนจริง — เลือกยกเลิกในแอปธนาคารหลังเห็นชื่อบัญชี</div></div>` });
}
document.addEventListener('input', e => { if (e.target.id === 'ppId') ppHint(); });

async function setMenuActive(id, active) {
  try {
    const r = await api('adminConfig'); if (!r.ok) throw new Error(r.error || 'โหลดเมนูไม่สำเร็จ');
    const m = r.menu.find(x => x.id === id); if (!m) throw new Error('ไม่พบเมนู');
    const saved = await api('saveMenu', { menu: { ...m, active } });
    if (!saved.ok) throw new Error(saved.error || 'บันทึกไม่สำเร็จ');
    await loadConfig(true); await loadAdminMenu(); renderPos(); toast(active ? 'เปิดขายเมนูแล้ว' : 'ปิดขายเมนูแล้ว');
  } catch (e) { toast('เปลี่ยนสถานะไม่สำเร็จ: ' + e.message, true); }
}
async function setAddonActive(id, active) {
  try {
    const r = await api('adminConfig'); if (!r.ok) throw new Error(r.error || 'โหลดตัวเลือกไม่สำเร็จ');
    const a = r.addons.find(x => x.id === id); if (!a) throw new Error('ไม่พบตัวเลือกเสริม');
    const saved = await api('saveAddon', { addon: { ...a, active } });
    if (!saved.ok) throw new Error(saved.error || 'บันทึกไม่สำเร็จ');
    await loadConfig(true); await loadAdminMenu(); renderPos(); toast(active ? 'เปิดใช้ตัวเลือกเสริมแล้ว' : 'ปิดใช้ตัวเลือกเสริมแล้ว');
  } catch (e) { toast('เปลี่ยนสถานะไม่สำเร็จ: ' + e.message, true); }
}

function startConfigPolling() {
  if (configPollTimer) clearInterval(configPollTimer);
  configPollTimer = setInterval(async () => {
    if (!S.session || !apiUrl()) return;
    try {
      const r = await api('configVersion');
      if (r && r.error === 'auth') { onAuthLost(); return; }
      if (r.ok && knownConfigVersion !== null && Number(r.version) !== Number(knownConfigVersion)) {
        const ok = await loadConfig(true);
        if (ok) {
          renderPos();
          if (S.view === 'settings' && S.session.role === 'admin') loadAdminMenu();
          toast('เมนู/ราคามีการอัปเดตจากระบบกลาง');
        }
      }
    } catch (e) { /* network may be temporarily unavailable; keep cached config */ }
  }, 12000);
}

/* =====================================================================
   Event wiring
   ===================================================================== */
// กันกดย้ำ: (1) ปุ่มที่กำลังทำงานอยู่จะไม่รับการกดซ้ำจนงานเสร็จ (2) 450 มิลลิวินาทีแรกหลังเปลี่ยนหน้า ไม่รับการแตะ (กันนิ้วที่กดย้ำไปโดนปุ่มหน้าใหม่ที่อยู่ตำแหน่งเดียวกัน)
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.busy) return;
  if (Date.now() - viewAt < 450 && !t.closest('#pad') && !t.closest('#nav')) return;
  t.dataset.busy = '1';
  try { await onClick(e, t); } finally { delete t.dataset.busy; }
});
async function onClick(e, t) {
  const d = t.dataset;

  // PIN pad
  if (t.closest('#pad')) {
    if (d.k === 'del') pin = pin.slice(0, -1);
    else if (d.k === 'go') { doLogin(); return; }
    else if (pin.length < 6) pin += d.k;
    pinMsg(''); renderPin(); return;
  }
  if (t.id === 'srvBtn') {
    openForm({ title: 'ตั้งค่าเซิร์ฟเวอร์', sub: 'วาง URL ของ Apps Script Web app (ลงท้ายด้วย /exec)', saveText: 'บันทึก URL',
      html: `<div class="field"><input class="inp" id="srvUrl" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(apiUrl())}"></div>`,
      onSave: async () => { const v = valIn('srvUrl'); if (v && !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(v)) { toast('URL ต้องขึ้นต้นด้วย https://script.google.com/…', true); return false; } LS.set('eh_api', v); toast('บันทึก URL แล้ว'); return true; } });
    return;
  }

  // nav
  if (d.go) { show(d.go); return; }
  if (t.id === 'syncPill' || t.closest('#syncPill')) { syncQueue(); return; }
  if (t.closest('#prnPill')) { if (S.dev.mode === 'ble') { try { await connectPrinter(false); toast('เชื่อมต่อเครื่องพิมพ์แล้ว'); } catch (er) { toast(er.message, true); } } return; }

  // POS
  if (d.cat) { S.cat = d.cat; renderPos(); return; }
  if (t.classList.contains('tile') && !t.classList.contains('prev')) { const it = S.cfg && S.cfg.menu.find(m => m.id === d.id); if (it) openSheet(it); return; }
  if (d.q && t.closest('.stepper') && !t.closest('#sheet')) { const l = S.cart[+d.i]; if (!l) return; l.qty += +d.q; if (l.qty <= 0) S.cart.splice(+d.i, 1); renderCart(); return; }
  if (t.id === 'cartBar') { openCart(true); return; }
  if (t.id === 'cartClose') { openCart(false); return; }
  if (t.id === 'clearCart') { if (await askConfirm('ล้างออเดอร์ทั้งหมด?', 'ล้างเลย')) { S.cart = []; renderCart(); openCart(false); } return; }
  if (t.id === 'toCheckout') { openCart(false); openCheckout(); return; }

  // Sheet
  if (d.sw) { SH.sweet = d.sw; renderSheet(); return; }
  if (d.top) { SH.tops.has(d.top) ? SH.tops.delete(d.top) : SH.tops.add(d.top); renderSheet(); return; }
  if (d.sq) { SH.qty = Math.max(1, SH.qty + +d.sq); renderSheet(); return; }
  if (t.id === 'shCancel') { closeSheet(); return; }
  if (t.id === 'shAdd') { addFromSheet(); return; }

  // Checkout
  if (t.id === 'coBack') { show('pos'); return; }
  if (d.g !== undefined) { S.cust.gender = S.cust.gender === d.g ? '' : d.g; updateCheckoutTotals(); return; }
  if (d.a !== undefined) { S.cust.age = S.cust.age === d.a ? '' : d.a; updateCheckoutTotals(); return; }
  if (t.id === 'toPay') { openPay(); return; }

  // Pay
  if (t.id === 'payBack') { show('checkout'); return; }
  if (d.m) { setPayMethod(d.m); return; }
  if (d.cash) { $('#cashIn').value = d.cash; updateChange(); return; }
  if (t.id === 'confirmPay') { finalizeOrder(); return; }

  // Done
  if (t.id === 'reprint') { doPrint(S.lastOrder, false); return; }
  if (t.id === 'newOrder') { show('pos'); return; }

  // Dashboard
  if (d.pre) { S.dash.preset = d.pre; renderDash(); return; }
  if (t.id === 'dashReload') { renderDash(); return; }
  if (d.void) {
    if (!(await askConfirm('ยกเลิกบิลนี้? ข้อมูลจะถูกทำเครื่องหมาย void ในชีต (ไม่ลบ)', 'ยกเลิกบิล'))) return;
    try { const r = await api('voidOrder', { orderId: d.void }); toast(r.ok ? (r.already ? 'บิลนี้ถูกยกเลิกไว้แล้ว' : 'ยกเลิกบิลแล้ว') : 'ยกเลิกไม่สำเร็จ: ' + errMsg(r), !r.ok); if (r.ok) renderDash(); } catch { toast('เชื่อมต่อไม่ได้', true); }
    return;
  }

  // Menu management (admin only)
  if (t.id === 'newMenu') { await editMenuRecord(); return; }
  if (t.id === 'newAddon') { await editAddonRecord(); return; }
  if (t.id === 'newPromo') { await editPromotionRecord(); return; }
  if (t.id === 'newExpense') { await editExpenseRecord(); return; }
  if (d.editexpense) { const r = await api('adminConfig'); const e = (r.expenses || []).find(x => x.id === d.editexpense); if (e) await editExpenseRecord(e); return; }
  if (d.toggleexpense) { await setExpenseActive(d.toggleexpense, d.active !== '1'); return; }
  if (d.editpromo) { const r = await api('adminConfig'); const p = (r.promotions || []).find(x => x.id === d.editpromo); if (p) await editPromotionRecord(p); return; }
  if (d.togglepromo) { await setPromotionActive(d.togglepromo, d.active !== '1'); return; }
  if (d.editcost) { await editCostRecord(d.editcost, t.dataset.costname || d.editcost, Number(t.dataset.cost || 0)); return; }
  if (d.editmenu) { const r = await api('adminConfig'); const m = r.menu && r.menu.find(x => x.id === d.editmenu); if (m) await editMenuRecord(m); return; }
  if (d.togglemenu) { await setMenuActive(d.togglemenu, d.active !== '1'); return; }
  if (d.editaddon) { const r = await api('adminConfig'); const a = r.addons && r.addons.find(x => x.id === d.editaddon); if (a) await editAddonRecord(a); return; }
  if (d.toggleaddon) { await setAddonActive(d.toggleaddon, d.active !== '1'); return; }

  if (t.id === 'openTpl') { openTplEditor(); return; }
  if (t.id === 'ppSave') { await savePaymentSettings(); return; }
  if (t.id === 'ppTest') { testQr1(); return; }
  // Settings
  if (d.mode) { S.dev.mode = d.mode; saveDev(); renderSettings(); updatePrinterPill(); return; }
  if (d.paper) { applySettingsInputs(); S.dev.paper = d.paper; saveDev(); renderSettings(); return; }
  if (d.size) { const [w, hh] = d.size.split('x'); applySettingsInputs(); S.dev.w = Number(w); S.dev.h = Number(hh); saveDev(); renderSettings(); return; }
  if (d.ff) { applySettingsInputs(); S.dev.ff = !S.dev.ff; saveDev(); renderSettings(); return; }
  if (t.id === 'diagPrn') { bleDiagnose(); return; }
  if (t.id === 'pickPrn') { try { await connectPrinter(true); toast('เชื่อมต่อเครื่องพิมพ์แล้ว'); renderSettings(); } catch (er) { toast(er.message, true); } return; }
  if (t.id === 'testPrn') { applySettingsInputs(); const o = { queueNo: peekQueue(), createdAt: new Date().toISOString(), customerName: 'มิ้นท์', items: [{ name: 'EH! RUBY RUSHER', sweetness: 'ลดหวาน', toppings: [], qty: 1 }, { name: 'Strawberry', sweetness: 'ปกติ', toppings: ['ครีมชีส', 'กราโนล่า'], qty: 1 }] }; await doPrint(o, false); return; }
  if (t.id === 'saveDev') { applySettingsInputs(); toast('บันทึกแล้ว'); return; }
  if (t.id === 'syncNow') { await syncQueue(); toast(LS.get('eh_queue', []).length ? 'ยังส่งไม่หมด — ตรวจอินเทอร์เน็ต/เข้าสู่ระบบ' : 'ส่งครบแล้ว', !!LS.get('eh_queue', []).length); renderSettings(); return; }
  if (t.id === 'retryFailed') { const f = LS.get('eh_failed', []); LS.set('eh_queue', LS.get('eh_queue', []).concat(f.map(o => { const c = { ...o }; delete c.err; return c; }))); LS.set('eh_failed', []); await syncQueue(); renderSettings(); toast(LS.get('eh_failed', []).length ? 'ยังมีบางรายการส่งไม่ผ่าน' : 'ส่งใหม่แล้ว'); return; }
  if (t.id === 'exportFailed') { const blob = new Blob([JSON.stringify({ failed: LS.get('eh_failed', []), queue: LS.get('eh_queue', []) }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `eh-pos-backup-${ymd(new Date())}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return; }
  if (t.id === 'refreshCfg') { const ok = await loadConfig(true); toast(ok ? 'อัปเดตเมนูแล้ว' : 'อัปเดตไม่สำเร็จ', !ok); return; }
  if (d.rp) { const o = LS.get('eh_recent', []).find(x => x.id === d.rp); if (o) doPrint(o, false); return; }
  if (t.id === 'logoutBtn') { if (LS.get('eh_queue', []).length && !(await askConfirm('ยังมีออเดอร์ที่ไม่ได้ส่งเข้าชีต (จะส่งต่อเมื่อเข้าสู่ระบบอีกครั้ง) ออกจากระบบ?', 'ออกจากระบบ'))) return; logout(); return; }
}

function applySettingsInputs() {
  const v = id => { const el = $(id); return el ? el.value.trim() : null; };
  if (v('#stW')) S.dev.w = Math.min(80, Math.max(10, Number(v('#stW')) || 40));
  if (v('#stH')) S.dev.h = Math.min(200, Math.max(10, Number(v('#stH')) || 30));
  if (v('#stX') !== null) S.dev.offx = Number(v('#stX')) || 0;
  if (v('#stF') !== null) S.dev.feed = Math.max(0, Math.min(255, Number(v('#stF')) || 0));
  if (v('#devL')) S.dev.letter = (v('#devL').toUpperCase().replace(/[^A-Z]/g, '') || 'A');
  if (v('#devPP') !== null) S.dev.pp = v('#devPP').replace(/\D/g, '');
  if (v('#devChunk')) S.dev.chunk = Math.max(20, Number(v('#devChunk')) || 100);
  if (v('#devSvc') !== null) S.dev.svc = v('#devSvc');
  saveDev();
}

document.addEventListener('change', e => { if (e.target.id === 'promoSelect') updateCheckoutTotals(); });
document.addEventListener('input', e => {
  if (e.target.id === 'disc') updateCheckoutTotals();
  if (e.target.id === 'cashIn') updateChange();
});
document.addEventListener('keydown', e => {
  const typing = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (S.view === 'login' && !typing && $('#sheetWrap').hidden) { if (/^\d$/.test(e.key) && pin.length < 6) { pin += e.key; renderPin(); } else if (e.key === 'Backspace') { pin = pin.slice(0, -1); renderPin(); } else if (e.key === 'Enter') doLogin(); }
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
});
$('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });
$('#scrim').addEventListener('click', () => openCart(false));

$('#keypad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const i = $('#cashIn'); let v = String(i.value).replace(/\D/g, ''); const k = b.dataset.kp;
  if (k === 'C') v = ''; else if (k === 'del') v = v.slice(0, -1); else if (v.length < 6) v += k;
  i.value = v; i.dispatchEvent(new Event('input', { bubbles: true }));
});

/* ---------- เริ่มต้น ---------- */
(async function init() {
  renderPin(); updatePrinterPill(); updateSyncPill();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (S.session && tokenExp(S.session.token) > Date.now()) {
    if (!S.cfg) await loadConfig();
    afterLogin();
    loadConfig().then(ok => { if (ok && S.view === 'pos') renderPos(); });
  } else {
    if (S.session) { S.needLogin = true; updateSyncPill(); }
    show('login');
  }
})();

</script>
