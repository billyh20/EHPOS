<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1A1A">
<meta name="mobile-web-app-capable" content="yes">
<title>EH! FRESHY POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Prompt;font-weight:500;font-display:swap;src:url(fonts/prompt-thai-500-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:700;font-display:swap;src:url(fonts/prompt-thai-700-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:800;font-display:swap;src:url(fonts/prompt-thai-800-normal.woff2) format("woff2");unicode-range:U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:Prompt;font-weight:500;font-display:swap;src:url(fonts/prompt-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Prompt;font-weight:700;font-display:swap;src:url(fonts/prompt-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Prompt;font-weight:800;font-display:swap;src:url(fonts/prompt-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --yolk:#FFAE1A; --yolk-deep:#E89400; --ink:#1A1A1A; --ink-2:#3A3A3A; --mute:#6E6E73;
  --chalk:#F2F2F0; --line:#E2E2DE; --white:#fff;
  --berry:#E5365B; --lime:#4CB944; --grape:#7B3FBF; --ok:#1F9D55; --bad:#D93025;
  --r-tile:26px 26px 26px 7px; --r:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:Prompt,"Noto Sans Thai",system-ui,sans-serif;font-weight:500;color:var(--ink);background:var(--chalk);font-size:16px;line-height:1.35;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,button,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Views ---------- */
.view{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--chalk)}
.flow{z-index:20}
.sheet-wrap{z-index:40}

/* ---------- Login ---------- */
#v-login{background:var(--ink);color:#fff;align-items:center;justify-content:center;gap:18px;padding:24px;overflow:auto}
#v-login .logo{width:min(46vw,210px);height:auto}
.pin-dots{display:flex;gap:14px;height:22px;align-items:center}
.pin-dots i{width:18px;height:18px;border-radius:50%;border:3px solid #555;transition:background .08s,border-color .08s}
.pin-dots i.on{background:var(--yolk);border-color:var(--yolk)}
.pin-msg{min-height:24px;color:#ffb4a8;font-size:15px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
.pad button{height:68px;border-radius:22px 22px 22px 8px;background:#2B2B2B;color:#fff;font-size:28px;font-weight:700}
.pad button:active{background:var(--yolk);color:var(--ink)}
.pad .go{background:var(--yolk);color:var(--ink);font-size:20px;font-weight:800}
.pad .go:disabled{opacity:.35}
.link{color:#9a9a9a;font-size:14px;text-decoration:underline;padding:8px}
@media (max-height:640px){.pad{grid-template-columns:repeat(3,64px);gap:8px}.pad button{height:54px;font-size:24px}#v-login{gap:10px}#v-login .logo{width:110px}}

/* ---------- Top bar ---------- */
.top{position:fixed;top:0;left:0;right:0;height:64px;z-index:10;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--white);border-bottom:2px solid var(--ink)}
.top .logo{height:42px;width:auto;display:block}
.nav{display:flex;gap:6px;margin-left:8px}
.nav button{padding:10px 16px;border-radius:14px;font-weight:700;font-size:15px;color:var(--ink-2)}
.nav button.on{background:var(--ink);color:var(--yolk)}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--chalk);font-size:13px;font-weight:700;white-space:nowrap}
.pill b{width:9px;height:9px;border-radius:50%;background:var(--ok);display:block}
.pill.warn b{background:var(--yolk-deep)}
.pill.bad b{background:var(--bad)}
.who{font-size:14px;color:var(--mute);white-space:nowrap}
@media (max-width:640px){.who{display:none}.nav button{padding:9px 10px;font-size:14px}.top{padding:6px 10px;gap:6px}.top .logo{height:34px}.pill span.t{display:none}}

/* ---------- POS ---------- */
.pos-body{flex:1;min-height:0;display:flex}
.menu{flex:1;min-width:0;display:flex;flex-direction:column}
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:11px 20px;border-radius:999px;background:var(--white);font-weight:700;border:2px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--yolk);border-color:var(--ink)}
.grid{flex:1;overflow-y:auto;padding:10px 14px 110px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;align-content:start}
.tile{position:relative;text-align:left;border-radius:var(--r-tile);padding:14px 14px 12px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.tile .nm{font-size:19px;font-weight:800;line-height:1.15}
.tile .sub{font-size:12.5px;opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px}
.tile .pr{align-self:flex-end;padding:5px 13px;border-radius:999px;font-weight:800;font-size:17px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 10px}

.cart{width:360px;flex:none;background:var(--white);border-left:2px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.cart h2{padding:14px 16px 8px;font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.cart h2 button{display:none;font-size:15px;color:var(--mute);padding:6px 10px}
.lines{flex:1;overflow-y:auto;padding:0 12px}
.line{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:start}
.line .dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.line .t{font-weight:700;line-height:1.2}
.line .d{font-size:13px;color:var(--mute);margin-top:2px}
.line .rt{text-align:right}
.line .p{font-weight:800}
.stepper{display:inline-flex;align-items:center;gap:2px;margin-top:6px;background:var(--chalk);border-radius:999px}
.stepper button{width:34px;height:34px;font-size:20px;font-weight:800;border-radius:50%}
.stepper span{min-width:22px;text-align:center;font-weight:800}
.cart-foot{padding:12px 16px calc(14px + var(--safe-b));border-top:2px solid var(--ink);display:grid;gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot b{font-size:30px}
.btn{height:58px;border-radius:18px 18px 18px 7px;font-weight:800;font-size:18px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--yolk);color:var(--ink);box-shadow:0 4px 0 var(--yolk-deep)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yolk-deep)}
.btn.primary:disabled{background:#ddd;color:#999;box-shadow:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--chalk);color:var(--ink)}
.btn.danger{background:#FDE7E4;color:var(--bad)}
.btn.sm{height:42px;font-size:15px;padding:0 14px;border-radius:13px 13px 13px 5px}
.cart-bar{display:none}
@media (max-width:899px){
  .cart{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:82vh;border-left:0;border-radius:26px 26px 0 0;border-top:2px solid var(--ink);transform:translateY(105%);transition:transform .22s ease;z-index:30}
  .cart.open{transform:none}
  .cart h2 button{display:block}
  .cart-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));height:62px;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--ink);color:#fff;border-radius:20px 20px 20px 7px;font-weight:800;font-size:17px}
  .cart-bar b{color:var(--yolk);font-size:22px}
  .cart-bar[hidden]{display:none!important}
  .grid{padding-bottom:100px;grid-template-columns:repeat(2,1fr)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
}
@media (min-width:900px){.scrim{display:none}}

/* ---------- Sheet (เลือกรายละเอียดแก้ว) ---------- */
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--white);border-radius:28px 28px 0 0;padding:20px 20px calc(18px + var(--safe-b));max-height:92vh;overflow-y:auto;display:grid;gap:16px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:28px 28px 28px 8px}}
.sheet .hd{display:flex;gap:14px;align-items:center}
.sheet .sw{width:54px;height:54px;border-radius:20px 20px 20px 6px;flex:none}
.sheet h3{font-size:22px;font-weight:800;line-height:1.1}
.sheet .s{font-size:13px;color:var(--mute);margin-top:3px}
.grp-t{font-weight:800;margin-bottom:8px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:12px 18px;border-radius:14px 14px 14px 5px;background:var(--chalk);border:2px solid transparent;font-weight:700;min-height:48px}
.chip.on{background:var(--ink);color:var(--yolk)}
.chip small{font-weight:700;opacity:.75;margin-left:4px}
.note{font-size:14px;background:var(--chalk);padding:10px 12px;border-radius:12px;color:var(--ink-2)}
.qty-row{display:flex;align-items:center;justify-content:space-between}
.qty-row .stepper{margin:0}
.qty-row .stepper button{width:46px;height:46px;font-size:24px}
.qty-row .stepper span{font-size:20px;min-width:34px}

/* ---------- Flow pages (สรุป / ชำระ / เสร็จ) ---------- */
.fhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--white);border-bottom:2px solid var(--ink);flex:none}
.fhead h2{font-size:19px;font-weight:800}
.fbody{flex:1;overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start;max-width:980px;width:100%;margin:0 auto}
@media (min-width:900px){.fbody.two{grid-template-columns:1fr 1fr;align-items:start}}
.card{background:var(--white);border-radius:22px 22px 22px 8px;padding:16px;display:grid;gap:12px}
.card h3{font-size:16px;font-weight:800}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:14px;color:var(--ink-2)}
.inp{height:52px;border-radius:14px;border:2px solid var(--line);padding:0 14px;background:#fff;width:100%;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:var(--ink);outline:none}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.sum-line.big{font-size:22px;font-weight:800}
.sum-line .m{color:var(--mute);font-weight:500;font-size:13px}
.ffoot{padding:12px 14px calc(12px + var(--safe-b));background:var(--white);border-top:2px solid var(--ink);display:flex;gap:10px;flex:none}
.ffoot .btn{flex:1}
.paytabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paytabs button{height:54px;border-radius:16px 16px 16px 6px;background:var(--chalk);font-weight:800}
.paytabs button.on{background:var(--ink);color:var(--yolk)}
.qrbox{display:grid;justify-items:center;gap:10px;text-align:center}
.qrbox canvas,.qrbox img{width:min(78vw,300px);height:auto;image-rendering:pixelated;background:#fff;padding:10px;border-radius:18px;border:2px solid var(--ink)}
.qr-amt{font-size:40px;font-weight:800}
.qr-warn{background:#FFF1D6;border-radius:14px;padding:12px;font-size:14px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.change{font-size:30px;font-weight:800}
.doneq{background:var(--yolk);border-radius:36px 36px 36px 10px;padding:26px 34px 22px;text-align:center;transform:rotate(-2deg);margin:12px auto 0;box-shadow:0 6px 0 var(--ink)}
.doneq small{display:block;font-weight:700;font-size:15px}
.doneq b{display:block;font-size:84px;line-height:1;font-weight:800;letter-spacing:1px}
.stat{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;font-weight:700}

/* ---------- Dashboard / Settings ---------- */
.page{flex:1;overflow-y:auto;padding:14px 14px 40px}
.page-in{max-width:1100px;margin:0 auto;display:grid;gap:14px}
#dashOut{display:grid;gap:14px}
.range{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--white);border-radius:20px 20px 20px 7px;padding:14px}
.kpi .l{font-size:13px;color:var(--mute);font-weight:700}
.kpi .v{font-size:28px;font-weight:800;margin-top:2px}
.kpi .h{font-size:12.5px;color:var(--mute);margin-top:2px}
.kpi.ink{background:var(--ink);color:#fff}.kpi.ink .l,.kpi.ink .h{color:#bbb}.kpi.ink .v{color:var(--yolk)}
.cols{display:grid;gap:14px}
@media (min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.hbar .bar{height:16px;background:var(--chalk);border-radius:8px;overflow:hidden}
.hbar .bar i{display:block;height:100%;border-radius:8px}
.hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.vbars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:6px;overflow-x:auto}
.vbars .c{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:11px}
.vbars .c i{width:100%;background:var(--ink);border-radius:7px 7px 2px 2px;min-height:2px}
.vbars .c.peak i{background:var(--yolk)}
.vbars .c span{color:var(--mute);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:700}
.tbl th{font-size:12.5px;color:var(--mute)}
.insight{display:grid;gap:8px}
.insight li{list-style:none;background:var(--chalk);border-radius:14px;padding:10px 12px;font-size:14.5px}
ul{margin:0;padding:0}
.sec-t{font-size:15px;font-weight:800}
.hint{font-size:13px;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.admin-list{display:grid;gap:8px}.admin-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.admin-item:last-child{border-bottom:0}.admin-meta{min-width:0}.admin-meta b{display:block;overflow-wrap:anywhere}.admin-meta small{color:var(--ink-2)}.admin-actions{display:flex;gap:6px;flex-shrink:0}.admin-actions .btn{height:36px;padding:0 10px;font-size:13px}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rowl:last-child{border-bottom:0}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--bad)}

/* ---------- Print (โหมดพิมพ์ผ่านเบราว์เซอร์) ---------- */
#printArea{display:none}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;page-break-after:always;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* =====================================================================
   THEME — แถบข้างสีเข้ม · พื้นอุ่นไล่เฉด · การ์ดสี (ตาม Redesign)
   ===================================================================== */
:root{--yolk-lt:#FFC24D;--bg-warm:radial-gradient(120% 90% at 100% 0%,#FFE3A8 0%,#FFF4DC 38%,#F7F4EE 70%);--rail:linear-gradient(180deg,#2A2A2A 0%,#141414 100%);--g-yolk:linear-gradient(135deg,#FFC24D 0%,#FFAE1A 50%,#F29A00 100%);--g-dark:linear-gradient(145deg,#2E2E2E,#141414);--glass:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.8));--sh:0 2px 10px rgba(26,26,26,.06);--sh-lg:0 24px 60px rgba(120,80,0,.14),0 2px 8px rgba(26,26,26,.05);--rail-w:92px;--mute:#6B6B66}
body{background:#F7F4EE}
.view{background:var(--bg-warm)}
.phead{padding:6px 18px 0}.phead small{display:block;color:var(--mute);font-size:14px}.phead h1{margin:0;font-size:28px;font-weight:800;line-height:1.15}
/* ปุ่ม */
.btn{border-radius:18px;height:56px}
.btn.primary{background:var(--g-yolk);box-shadow:0 10px 24px rgba(242,154,0,.32)}
.btn.primary:active{transform:scale(.98);box-shadow:0 4px 10px rgba(242,154,0,.3)}
.btn.primary:disabled{background:#E8E4DA;color:#A29E92;box-shadow:none}
.btn.dark{background:var(--g-dark);color:var(--yolk-lt)}
.btn.ghost{background:#fff;box-shadow:var(--sh)}
.btn.sm{border-radius:14px;height:42px}
.chip{border-radius:14px;background:#fff;box-shadow:var(--sh)}.chip.on{background:var(--ink);color:var(--yolk-lt)}
.pill{background:rgba(255,255,255,.9);box-shadow:var(--sh)}
.card{background:var(--glass);border-radius:22px;box-shadow:var(--sh)}
.inp{background:#FBF9F4;border-color:#ECE7DB;border-radius:14px}
.sheet{background:#fff;border-radius:28px 28px 0 0}
@media (min-width:700px){.sheet{border-radius:28px}}
.note,.insight li{background:#F7F4EE}
#toast{border-radius:16px}
/* เข้าสู่ระบบ */
#v-login{background:radial-gradient(90% 60% at 50% 0%,#4a3208 0%,#1A1A1A 58%,#141414 100%)}
.pad button{border-radius:22px;background:rgba(255,255,255,.09);backdrop-filter:blur(6px)}
.pad button:active,.pad .go{background:var(--g-yolk);color:var(--ink)}
/* แถบข้าง / แถบนำทาง */
.top{background:var(--rail);border:0;color:#fff}
.top .logo{width:48px;height:48px;border-radius:16px;box-shadow:0 6px 16px rgba(255,174,26,.35)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#B5B5B0;font-size:11px;font-weight:700}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{background:rgba(255,174,26,.16);color:var(--yolk)}
.status{display:flex;align-items:center;gap:8px}
.who{color:#B5B5B0}
/* POS */
.tabs{width:fit-content;max-width:calc(100% - 28px);margin:12px 14px 0;padding:6px;background:rgba(255,255,255,.7);border-radius:999px;box-shadow:var(--sh)}
.tabs button{border:0;background:transparent;color:var(--mute);padding:10px 20px}
.tabs button.on{background:var(--ink);color:var(--yolk-lt)}
.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{padding:0;min-height:200px;background:#fff;color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:var(--sh);gap:0;justify-content:flex-start;align-items:stretch}

/* =====================================================================
   PRO LAYER — ระบบดีไซน์ POS (มือถือเป็นหลัก) + Motion
   ===================================================================== */
:root{--bg:#F5F4F1;--surface:#fff;--hair:#E6E3DC;--hair-2:#EFECE6;--txt:#1C1B19;--txt-2:#6B6860;--accent:#FFAE1A;--accent-ink:#7A4E00;--accent-soft:#FFF3D6;
  --e-out:cubic-bezier(.2,.8,.2,1);--e-spring:cubic-bezier(.34,1.4,.5,1);--t-fast:140ms;--t-med:240ms}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--txt)}
.view{background:var(--bg)}
#v-login{background:radial-gradient(90% 60% at 50% 0%,#4a3208 0%,#1A1A1A 58%,#141414 100%)}
button{transition:transform var(--t-fast) var(--e-out),background-color var(--t-fast),color var(--t-fast),box-shadow var(--t-fast)}
button:active:not(:disabled){transform:scale(.97)}
.btn{font-weight:700;font-size:16px;border-radius:14px;height:52px;letter-spacing:0}
.btn.primary{background:var(--accent);box-shadow:none;color:var(--txt)}
.btn.primary:active{transform:scale(.98);box-shadow:none}
.btn.primary:disabled{background:#ECE9E2;color:#A9A59C}
.btn.dark{background:var(--txt);color:#fff}
.btn.ghost{background:var(--surface);box-shadow:none;border:1px solid var(--hair)}
.btn.sm{height:40px;font-size:14px;border-radius:10px}
.card{background:var(--surface);border-radius:16px;box-shadow:none;border:1px solid var(--hair)}
.card h3{font-size:15px;font-weight:700}
.inp{background:#FAF9F7;border:1px solid var(--hair);border-radius:12px;min-height:48px}
.inp:focus{outline:none;border-color:var(--txt);background:#fff}
.field label{font-size:13px;font-weight:500;color:var(--txt-2)}
.chip{min-height:42px;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--hair);box-shadow:none;font-weight:500;font-size:14.5px}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt);font-weight:700}
.sum-line{font-weight:500}.sum-line.big{font-size:20px;font-weight:700}
.fhead{background:var(--surface);border-bottom:1px solid var(--hair);padding:10px 12px;gap:6px}
.fhead h2{font-size:17px;font-weight:700;margin:0}
.fhead .btn.ghost{border:0;background:transparent;height:40px;padding:0 10px;font-size:15px}
.ffoot{background:var(--surface);backdrop-filter:none;border-top:1px solid var(--hair);box-shadow:none}
.paysum{border-radius:16px;box-shadow:none;background:var(--txt)}
.paytabs button{height:52px;border-radius:12px;background:var(--surface);box-shadow:none;border:1px solid var(--hair);font-weight:500}
.paytabs button.on{outline:0;border:2px solid var(--txt);font-weight:700}
.keypad button{box-shadow:none;border:1px solid var(--hair);border-radius:12px;font-weight:500}
.doneq{background:var(--accent);box-shadow:none;transform:none;border-radius:24px}
.kpi{background:var(--surface);box-shadow:none;border:1px solid var(--hair);border-radius:16px}
.kpi.ink{background:var(--txt)}
.top .logo{pointer-events:none;box-shadow:none}
.brand{display:none}

  .grid .tile .pr{font-size:14.5px;font-weight:700;color:var(--txt);margin-top:3px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes vTab{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes vFwd{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes barIn{from{transform:translateY(140%)}to{transform:none}}
@keyframes rowFlash{0%{background:var(--accent-soft)}100%{background:transparent}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.view.v-tab{animation:vTab var(--t-med) var(--e-out)}
.view.v-fwd{animation:vFwd var(--t-med) var(--e-out)}
.view.v-back{animation:vBack var(--t-med) var(--e-out)}
.sheet-wrap:not([hidden]){animation:fadeIn var(--t-med) var(--e-out)}
.sheet-wrap:not([hidden]) .sheet{animation:sheetUp 280ms var(--e-out)}
.sheet-wrap.closing{animation:fadeOut 180ms ease forwards}
.sheet-wrap.closing .sheet{animation:sheetDown 200ms cubic-bezier(.4,0,1,1) forwards}
.cart-bar:not([hidden]){animation:barIn 300ms var(--e-spring)}
.cart-bar.bump{animation:bump 360ms var(--e-spring)}
.cart-bar.bump b{display:inline-block;animation:pop 360ms var(--e-spring)}
.tile.added{animation:rowFlash 700ms ease-out}
.done-check{width:64px;height:64px;border-radius:50%;background:#E6F4EA;display:grid;place-items:center}
.done-check svg{width:34px;height:34px;fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done-check path{stroke-dasharray:30;stroke-dashoffset:0}
#v-done.v-fwd .done-check{animation:pop 420ms var(--e-spring) both}
#v-done.v-fwd .done-check path{stroke-dashoffset:30;animation:drawCheck 360ms 200ms var(--e-out) forwards}
#v-done.v-fwd .doneq{animation:pop 460ms 120ms var(--e-spring) both}
#v-done.v-fwd #doneSum,#v-done.v-fwd .stat{animation:rise 300ms 260ms var(--e-out) both}
#v-done.v-fwd .fbody>div:last-child{animation:rise 300ms 340ms var(--e-out) both}
@media (max-width:899px){
  .brand{flex:1}.brand b,.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .spacer{display:none}
  #prnPill .t{display:none!important}#prnPill::after{content:"เครื่องพิมพ์"}
  .cart-foot{background:var(--surface)}
  .cart-foot .btn.ghost{border:0;height:40px;color:var(--txt-2)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';

/* ---------- Toast ---------- */
let toastT;
function toast(msg, err = false) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', err ? 4200 : 2200);
}

/* ---------- API ---------- */
function apiUrl() { return LS.get('eh_api', '') || API_URL_DEFAULT; }

async function api(action, payload = {}, auth = true) {
  const url = apiUrl();
  if (!url) throw new Error('no_api');
  const body = Object.assign({ action }, payload);
  if (auth) body.token = S.session && S.session.token;
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  try {
    const r = await fetch(url, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal, redirect: 'follow' });
    return await r.json();
  } finally { clearTimeout(t); }
}

function tokenExp(tok) {
  try {
    let b = tok.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    const bin = atob(b);
    const txt = typeof TextDecoder !== 'undefined' ? new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))) : decodeURIComponent(escape(bin));
    return JSON.parse(txt).e;
  } catch { return 0; }
}

/* ---------- View switching ---------- */
const TAB_VIEWS = ['pos', 'dash', 'settings'];
let viewAt = 0;
const FLOW_ORDER = { login: -1, pos: 0, dash: 0, settings: 0, checkout: 1, pay: 2, done: 3 };
function show(name) {
  const prev = S.view;
  if (prev !== name) viewAt = Date.now();
  S.view = name;
  if (prev && prev !== name) {
    const el = document.getElementById('v-' + name);
    if (el) {
      const a = FLOW_ORDER[prev] ?? 0, b = FLOW_ORDER[name] ?? 0;
      const cls = b > a ? 'v-fwd' : b < a ? 'v-back' : 'v-tab';
      el.classList.remove('v-tab', 'v-fwd', 'v-back'); void el.offsetWidth; el.classList.add(cls);
      clearTimeout(el._vt); el._vt = setTimeout(() => el.classList.remove(cls), 900);
    }
  }
  $$('.view').forEach(v => v.hidden = v.id !== 'v-' + name);
  $('#top').hidden = !TAB_VIEWS.includes(name);
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.go === name));
  if (name === 'pos') renderPos();
  if (name === 'dash') renderDash();
  if (name === 'settings') renderSettings();
}

   LOGIN (PIN ตรวจที่เซิร์ฟเวอร์ — ในหน้านี้ไม่มี PIN ใดๆ)
   ===================================================================== */
let pin = '';
let knownConfigVersion = null;
let configPollTimer = null;
function renderPin() {
  $('#pinDots').innerHTML = Array.from({ length: Math.max(4, pin.length) }, (_, i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('');
  $('#pinGo').disabled = pin.length < 4;
}
function pinMsg(t) { $('#pinMsg').textContent = t || ''; }

let loggingIn = false;
async function doLogin() {
  if (pin.length < 4 || loggingIn) return;
  loggingIn = true;
  try { await doLoginInner(); } finally { loggingIn = false; }
}
async function doLoginInner() {
  const btn = $('#pinGo'); btn.disabled = true; pinMsg('กำลังตรวจสอบ…');
  try {
    const r = await api('login', { pin }, false);
    if (r.ok) {
      S.session = { token: r.token, name: r.name, role: r.role };

function lum(hex) {
  const c = hex.replace('#', ''); const v = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16) / 255)
    .map(x => x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function fgFor(hex) {
  const L = lum(hex); const withInk = (L + 0.05) / (lum('#1A1A1A') + 0.05), withWhite = 1.05 / (L + 0.05);
  return withInk >= withWhite ? '#1A1A1A' : '#FFFFFF';
}

function monogram(name) {
  const n = name.replace(/^EH!\s*/i, '').trim(), w = n.split(/\s+/).filter(Boolean);
  if (/^[A-Za-z0-9]/.test(n)) return (w.length > 1 ? w[0][0] + w[1][0] : n.slice(0, 2)).toUpperCase();
  return Array.from(n).slice(0, 2).join('');
}

function counter() {
  const c = LS.get('eh_counter', null), today = ymd(new Date());
  return (c && c.date === today) ? c : { date: today, n: 0 };
}
const rid = () => { const a = new Uint8Array(3); crypto.getRandomValues(a); return [...a].map(x => x.toString(36).padStart(2, '0')).join('').slice(0, 4).toUpperCase(); };
const fmtQueue = n => S.dev.letter + pad(n, 3);
function peekQueue() { return fmtQueue(counter().n + 1); }

function manualDiscountVal() { return Math.max(0, Math.min(cartSub(), Math.round(Number(String($('#disc').value).replace(/\D/g, '')) || 0))); }
function activePromotions() {
  const today = ymd(new Date());
  return ((S.cfg && S.cfg.promotions) || []).filter(p => p.active !== false && (!p.startDate || p.startDate <= today) && (!p.endDate || p.endDate >= today));
}
function calcPromotion(p) {
  if (!p) return 0;
  const ids = String(p.eligibleMenuIds || '').split(',').map(x => x.trim()).filter(Boolean);
  const lines = ids.length ? S.cart.filter(l => ids.includes(String(l.item.id))) : S.cart;
  if (!lines.length) return 0;
  const qty = lines.reduce((n, l) => n + l.qty, 0);          // นับเฉพาะชิ้นที่ร่วมรายการ
  if (qty < Number(p.minQty || 1)) return 0;
  const eligibleTotal = lines.reduce((n, l) => n + lineTotal(l), 0);
  if (!eligibleTotal) return 0;
  const val = p.type === 'percent' ? Math.round(eligibleTotal * Number(p.value || 0) / 100) : Number(p.value || 0);
  return Math.max(0, Math.min(eligibleTotal, Math.round(val)));
}
function discountVal() {
  const manual = manualDiscountVal();
  const promo = Math.min(calcPromotion(S.selectedPromo), Math.max(0, cartSub() - manual));
  S.promoDiscount = promo;
  return Math.max(0, Math.min(cartSub(), manual + promo));
}

/* =====================================================================
   ชำระเงิน: QR พร้อมเพย์ / เงินสด
   ===================================================================== */
function crc16(str) {
  let c = 0xFFFF;
  for (let i = 0; i < str.length; i++) { c ^= str.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const tlv = (id, v) => id + pad(v.length, 2) + v;

function promptPayPayload(idRaw, amount) {
  const id = String(idRaw).replace(/\D/g, '');
  let sub, val;
  if (id.length === 15) { sub = '03'; val = id; }
  else if (id.length === 13) { sub = '02'; val = id; }
  else if (id.length === 10) { sub = '01'; val = '0066' + id.slice(1); }
  else return null;
  const acct = tlv('00', 'A000000677010111') + tlv(sub, val);
  let p = tlv('00', '01') + tlv('01', amount > 0 ? '12' : '11') + tlv('29', acct) + tlv('53', '764');
  if (amount > 0) p += tlv('54', amount.toFixed(2));
  p += tlv('58', 'TH') + '6304';
  return p + crc16(p);
}

function drawQr(total) {

    $('#qrHint').hidden = true; return;
  }
  const qr = qrcode(0, 'M'); qr.addData(payload); qr.make();
  holder.innerHTML = `<img alt="QR PromptPay ${total} บาท" src="${qr.createDataURL(8, 2)}">`;

let finalizing = false;
async function finalizeOrder() {
  if (finalizing) return;
  if (!S.cart.length) { show('pos'); return; }
  const total = orderTotal();

  }

    const q = takeQueue(), now = new Date();
    const order = {
      // ต่อท้ายรหัสสุ่ม กันออเดอร์ชนกันเมื่อ 2 เครื่องใช้รหัสเครื่องเดียวกัน/ล้างข้อมูลเบราว์เซอร์ (เดิมออเดอร์ที่ชนจะถูกมองว่าซ้ำและหายไป)
      id: `${q.date.replace(/-/g, '').slice(2)}-${S.dev.letter}${pad(q.n, 3)}-${rid()}`,
      queueNo: q.queueNo, device: S.dev.letter, cashier: S.session ? S.session.name : '', createdAt: now.toISOString(),
      customerName: S.cust.name, gender: S.cust.gender, ageRange: S.cust.age,
      items: S.cart.map(l => ({
        menuId: l.item.id, category: l.item.category, name: l.item.name, tier: l.item.tier,
        sweetness: l.item.isDrink ? l.sweetness : '', toppings: l.toppings.map(t => t.name),
        basePrice: l.basePrice, toppingsPrice: l.toppings.reduce((s, t) => s + t.price, 0), qty: l.qty, lineTotal: lineTotal(l),
        toppingIds: l.toppings.map(t => t.id)          // เซิร์ฟเวอร์คำนวณต้นทุนเอง (ไม่ส่งต้นทุนลงเครื่อง staff)
      })),
      subtotal: cartSub(), discount: S.discount, manualDiscount: manualDiscountVal(), promoDiscount: S.promoDiscount, promoId: S.selectedPromo ? S.selectedPromo.id : '', promoName: S.selectedPromo ? S.selectedPromo.name : '', total, paymentMethod: S.payMethod === 'qr' ? 'promptpay' : 'cash',
      cashReceived: received || '', change: change || '', note: ''
    };
    const queue = LS.get('eh_queue', []); queue.push(order);
    if (!LS.set('eh_queue', queue)) { LS.set('eh_recent', LS.get('eh_recent', []).slice(0, 5)); if (!LS.set('eh_queue', queue)) { toast('บันทึกออเดอร์ในเครื่องไม่ได้ (พื้นที่เต็ม) — กด “ส่งข้อมูลที่ค้าง” แล้วลองใหม่', true); return; } }
    const recent = LS.get('eh_recent', []); recent.unshift(Object.assign({ synced: false, printed: null }, order)); LS.set('eh_recent', recent.slice(0, 40));
    S.lastOrder = order; S.cart = [];
    $('#doneQ').textContent = order.queueNo;
    $('#doneSum').textContent = `${order.items.reduce((s, i) => s + i.qty, 0)} แก้ว · ${baht(order.total)}` + (change ? ` · ทอน ${baht(change)}` : '');
    $('#doneSync').innerHTML = '⏳ กำลังบันทึกลงชีต…'; $('#donePrint').innerHTML = '';
    show('done');
    syncQueue(); doPrint(order, true);
  } finally { finalizing = false; }
}

/* ---------- คิวส่งข้อมูลเข้าชีต (ทำงานออฟไลน์ได้ ส่งซ้ำอัตโนมัติ) ---------- */
let syncing = false;
async function syncQueue() {
  if (syncing) return; syncing = true;
  try {
    for (;;) {
      const q = LS.get('eh_queue', []); if (!q.length) break;
      if (!S.session || tokenExp(S.session.token) < Date.now()) { onAuthLost(); break; }
      let r;
      try { r = await api('submitOrder', { order: q[0] }); } catch (e) { S.offline = true; break; }
      if (!r || typeof r !== 'object') { S.offline = true; break; }
      if (r.ok) {
        S.offline = false; S.needLogin = false;
        q.shift(); LS.set('eh_queue', q);
        markSynced();
      } else if (r.error === 'auth') { onAuthLost(); break; }
      else if (r.error !== 'bad_order') { S.offline = true; break; }   // busy / ระบบกลางขัดข้องชั่วคราว → ส่งซ้ำรอบหน้า ไม่ทิ้งออเดอร์
      else { // ออเดอร์เสียรูปแบบจริง — แยกออกไม่ให้คิวติด (กู้คืนได้ที่หน้าตั้งค่า)
        const failed = LS.get('eh_failed', []); failed.push(Object.assign({ err: r.error }, q.shift())); LS.set('eh_failed', failed); LS.set('eh_queue', q);
      }
    }
  } finally { syncing = false; updateSyncPill(); }
}
function markSynced() {
  const pending = new Set(LS.get('eh_queue', []).map(o => o.id));
  const rec = LS.get('eh_recent', []); rec.forEach(o => { o.synced = !pending.has(o.id); }); LS.set('eh_recent', rec);
  if (S.lastOrder && S.view === 'done') {
    const done = !pending.has(S.lastOrder.id);
    $('#doneSync').innerHTML = done ? '✅ บันทึกลงชีตแล้ว' : '⏳ รอส่งเข้าชีต';
  }
}
function updateSyncPill() {
  const n = LS.get('eh_queue', []).length, p = $('#syncPill');
  p.className = 'pill' + (S.needLogin && n ? ' bad' : (n || S.offline) ? ' warn' : '');
  $('#syncTxt').textContent = S.needLogin && n ? `${n} รายการรอ — เข้าสู่ระบบใหม่` : n ? `รอส่ง ${n}` : S.offline ? 'ออฟไลน์' : 'ซิงก์แล้ว';
  if (S.view === 'done' && S.lastOrder) markSynced();
}
setInterval(() => { if (S.session && LS.get('eh_queue', []).length) syncQueue(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.session) syncQueue(); });
addEventListener('online', () => syncQueue());

/* =====================================================================
   พิมพ์สติกเกอร์ติดแก้ว (ESC/POS raster — รองรับภาษาไทยเพราะวาดเป็นรูป)
   ===================================================================== */
const pageDots = () => (String(S.dev.paper) === '80' ? 576 : 384);   // 58 มม. พิมพ์ได้ 48 มม. = 384 จุด · 80 มม. พิมพ์ได้ 72 มม. = 576 จุด (203 dpi)
const DOTS_MM = 8;
const logoMono = new Image(); logoMono.src = LOGO_MONO;

function stickerSize() {
  const w = Number(S.dev.w || setting('sticker_width_mm', 40)), h = Number(S.dev.h || setting('sticker_height_mm', 30));
  return { wMm: w, hMm: h, W: Math.min(pageDots(), Math.floor(w * DOTS_MM / 8) * 8), H: Math.round(h * DOTS_MM) };
}

function expandCups(order) {
  const cups = []; order.items.forEach(it => { for (let i = 0; i < it.qty; i++) cups.push(it); });
  return cups.map((it, i) => ({ it, n: i + 1, of: cups.length }));
}

function fit(g, text, weight, size, maxW, min = 14) {
  let s = size; g.font = `${weight} ${s}px Prompt`;
  while (g.measureText(text).width > maxW && s > min) { s -= 1; g.font = `${weight} ${s}px Prompt`; }
  return s;
}
function wrap(g, text, maxW, maxLines) {
  const words = text.split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines.slice(0, maxLines);
}

const TPL_BASE = { queue: 66, name: 34, sweet: 24, top: 22, cust: 24, time: 20, footer: 20 };

    { id: 't2', name: 'ชื่อลูกค้าเด่น', logo: false, border: true, align: 'center', footer: 'ขอบคุณค่ะ',

async function drawSticker(order, cup, tplIn) {
  try { if (document.fonts && document.fonts.load) await Promise.all([document.fonts.load('800 20px Prompt'), document.fonts.load('700 20px Prompt'), document.fonts.load('500 20px Prompt')]); } catch { }
  const tpl = tplIn || activeTemplate(), { W, H } = stickerSize(), offX = Math.max(0, Math.floor((pageDots() - W) / 2)) + Number(S.dev.offx || 0);
  const c = document.createElement('canvas'); c.width = pageDots(); c.height = H;
  const g = c.getContext('2d'), pad2 = 10, bd = tpl.border ? 6 : 0;
  const x0 = offX + pad2 + bd, innerW = W - (pad2 + bd) * 2, top0 = pad2 + bd, maxY = H - pad2 - bd;
  const sweets = splitList(setting('sweetness_options', 'ปกติ,ลดหวาน')), isDrink = !!cup.it.sweetness;
  const t = new Date(order.createdAt), time = `${pad(t.getHours())}:${pad(t.getMinutes())}`;
  const nm = cup.it.name.replace(/^EH!\s*/i, '');
  const logoOK = tpl.logo && logoMono.complete && logoMono.naturalWidth;
  // คืนความสูงที่ใช้ ถ้า dry=true แค่วัด ไม่วาด
  function run(k, dry) {
    let y = top0;
    const put = (txt, weight, px, opts = {}) => {
      const w = opts.maxW || innerW; const s = fit(g, txt, weight, px, w, 10); g.font = `${weight} ${s}px Prompt`;
      const tw = g.measureText(txt).width, x = tpl.align === 'center' ? x0 + (innerW - tw) / 2 : x0;
      if (!dry) g.fillText(txt, x, y); y += Math.round(s * 1.2);
    };
    if (logoOK && !tpl.fields.some(f => f.on && f.k === 'queue')) { const lh = Math.round(40 * k), lw = Math.round(lh * logoMono.width / logoMono.height); if (!dry) g.drawImage(logoMono, tpl.align === 'center' ? x0 + (innerW - lw) / 2 : x0, y, lw, lh); y += lh + 4; }
    tpl.fields.filter(f => f.on).forEach(f => {
      const px = Math.round(TPL_BASE[f.k] * (TPL_SIZES[f.size] || 1) * k);
      if (f.k === 'queue') {
        const lh = Math.round(px * 0.9), lw = logoOK ? Math.round(lh * logoMono.width / logoMono.height) : 0;
        const qs = fit(g, order.queueNo, 800, px, innerW - lw - 8, 10); g.font = `800 ${qs}px Prompt`;
        const tw = g.measureText(order.queueNo).width, x = (tpl.align === 'center' && !lw) ? x0 + (innerW - tw) / 2 : x0;
        if (!dry) { g.fillText(order.queueNo, x, y - Math.round(qs * 0.08)); if (lw) g.drawImage(logoMono, x0 + innerW - lw, y, lw, lh); }
        y += Math.max(Math.round(qs * 1.1), lw ? lh + 4 : 0);
      } else if (f.k === 'name') put(nm, 800, px);
      else if (f.k === 'sweet') {
        if (!isDrink) return;
        const label = sweetLabel(cup.it.sweetness), reduced = cup.it.sweetness !== sweets[0], s = fit(g, label, 800, px, innerW - 16, 10);
        g.font = `800 ${s}px Prompt`; const tw = g.measureText(label).width, ph = Math.round(s * 1.25), px0 = tpl.align === 'center' ? x0 + (innerW - tw - 16) / 2 : x0;
        if (!dry) { if (reduced) { g.fillRect(px0, y, tw + 16, ph); g.fillStyle = '#fff'; g.fillText(label, px0 + 8, y + 1); g.fillStyle = '#000'; } else g.fillText(label, px0, y + 1); }
        y += ph + 2;
      } else if (f.k === 'top') {
        if (!(cup.it.toppings && cup.it.toppings.length)) return;
        const full = '+ ' + cup.it.toppings.join(' + ');
        g.font = `700 ${px}px Prompt`; let lines = wrap(g, full, innerW, 99);
        if (lines.length > 2) { lines = lines.slice(0, 2); lines[1] = lines[1].replace(/\s*\+?\s*$/, '') + ' …'; }   // บอกว่ามีท็อปปิงมากกว่านี้ ไม่ตัดหายเงียบ
        lines.forEach(l => { const s = fit(g, l, 700, px, innerW, 10); g.font = `700 ${s}px Prompt`; const tw = g.measureText(l).width; if (!dry) g.fillText(l, tpl.align === 'center' ? x0 + (innerW - tw) / 2 : x0, y); y += Math.round(px * 1.15); });
      } else if (f.k === 'cust') { if (order.customerName) put(order.customerName, 800, px); }
      else if (f.k === 'time') put(`${cup.n}/${cup.of}  ${time}`, 500, px);
      else if (f.k === 'footer') { if (tpl.footer) put(tpl.footer, 700, px); }
    });
    return y - top0;
  }
  g.fillStyle = '#fff'; g.fillRect(0, 0, pageDots(), H); g.fillStyle = '#000'; g.textBaseline = 'top';
  let k = 1; const avail = maxY - top0;
  for (let i = 0; i < 14; i++) { const used = run(k, true); if (used <= avail) break; k *= Math.max(0.6, avail / used) * 0.97; }
  run(k, false);
  if (tpl.border) { g.lineWidth = 3; g.strokeStyle = '#000'; g.strokeRect(offX + 3, 3, W - 6, H - 6); }
  return c;
}

function rasterBytes(canvas) {
  const g = canvas.getContext('2d'), w = canvas.width, h = canvas.height, d = g.getImageData(0, 0, w, h).data, wb = w / 8, parts = [];
  for (let y0 = 0; y0 < h; y0 += 128) {
    const bh = Math.min(128, h - y0), body = new Uint8Array(wb * bh);
    for (let y = 0; y < bh; y++) for (let xb = 0; xb < wb; xb++) {
      let b = 0;
      for (let bit = 0; bit < 8; bit++) { const i = ((y0 + y) * w + xb * 8 + bit) * 4; if (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114 < 150) b |= 0x80 >> bit; }
      body[y * wb + xb] = b;
    }
    parts.push(new Uint8Array([0x1D, 0x76, 0x30, 0, wb & 255, wb >> 8, bh & 255, bh >> 8]), body);
  }
  return parts;
}

async function buildJob(order) {
  const parts = [new Uint8Array([0x1B, 0x40])], canvases = [];
  for (const cup of expandCups(order)) {
    const cv = await drawSticker(order, cup); canvases.push(cv);
    parts.push(...rasterBytes(cv));
    if (S.dev.ff) parts.push(new Uint8Array([0x0C]));   // เครื่องฉลากแบบมีช่องว่าง: เลื่อนไปดวงถัดไปเอง
    else { const feed = Math.max(0, Math.min(255, Number(S.dev.feed) || 0)); if (feed) parts.push(new Uint8Array([0x1B, 0x4A, feed])); }
  }
  const len = parts.reduce((s, p) => s + p.length, 0), out = new Uint8Array(len); let o = 0;
  parts.forEach(p => { out.set(p, o); o += p.length; });
  return { bytes: out, canvases };
}

/* ---- Bluetooth (Web Bluetooth, Chrome บน Android) ---- */
const U16 = x => `0000${x}-0000-1000-8000-00805f9b34fb`;
const BLE_SERVICES = [U16('18f0'), U16('ff00'), U16('fff0'), U16('ffe0'), 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  U16('ae30'), U16('fee7'), U16('ff12'), U16('ffb0'), U16('ffc0'), U16('ffd0'), U16('ffe5'), U16('fe00'), U16('ae00'), U16('af30'), U16('18f1'),
  'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f', '0000fd00-0000-1000-8000-00805f9b34fb', '00005500-0000-1000-8000-00805f9b34fb', '6e400001-b5a3-f393-e0a9-e50e24dcca9e'].filter(Boolean);
const BLE_SKIP = [U16('1800'), U16('1801'), U16('180a'), U16('180f'), U16('fe59'), '8d53dc1d-1db7-4cd3-868b-8a527460aa84'];   // ข้ามบริการมาตรฐาน/อัปเดตเฟิร์มแวร์
const BLE_PREF_CHAR = [U16('ff02'), U16('2af1'), 'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f', '49535343-8841-43f4-a8d4-ecbe34729bb3', U16('ffe1'), U16('ae01'), '6e400002-b5a3-f393-e0a9-e50e24dcca9e'];
function normUuid(x) { x = String(x || '').trim().toLowerCase().replace(/^0x/, ''); if (/^[0-9a-f]{4}$/.test(x)) return U16(x); if (/^[0-9a-f]{8}$/.test(x)) return `${x}-0000-1000-8000-00805f9b34fb`; return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(x) ? x : ''; }
const bleServiceList = () => [...new Set([...String(S.dev.svc || '').split(/[\s,;]+/).map(normUuid).filter(Boolean), ...BLE_SERVICES])];
let bleDev = null, bleChar = null;

function bleErr(e) {
  const n = (e && e.name) || '', m = (e && e.message) || String(e || '');
  if (n === 'NotFoundError' && /cancel/i.test(m)) return 'ยกเลิกการเลือกเครื่องพิมพ์';
  if (n === 'NotFoundError') return 'ไม่พบเครื่องพิมพ์ — เปิดเครื่องพิมพ์ เปิด Bluetooth และ “ตำแหน่ง (Location)” ของมือถือ ถ้าเครื่องพิมพ์ต่ออยู่กับแอปอื่นหรือค้างเป็น “เชื่อมต่อแล้ว” ในตั้งค่า Bluetooth ของมือถือ ให้ตัดการเชื่อมต่อก่อน';
  if (n === 'SecurityError') return 'ต้องแตะปุ่ม “เลือก/เชื่อมต่อเครื่องพิมพ์” ด้วยตัวเองก่อน (Chrome ไม่ให้เชื่อมต่ออัตโนมัติ) แล้วลองพิมพ์อีกครั้ง';
  if (n === 'NetworkError' || /GATT|connect/i.test(m)) return 'เชื่อมต่อเครื่องพิมพ์ไม่สำเร็จ — ปิดแล้วเปิดเครื่องพิมพ์ ขยับให้ใกล้มือถือ และปิดแอปอื่นที่ใช้เครื่องพิมพ์อยู่ (เช่น RawBT) แล้วลองใหม่';
  if (n === 'NotSupportedError') return 'เบราว์เซอร์/เครื่องนี้ไม่รองรับการเชื่อมต่อแบบนี้ — ลองโหมด RawBT';
  return m || 'เชื่อมต่อเครื่องพิมพ์ไม่สำเร็จ';
}
async function gattConnect(dev) {
  let last;
  for (let k = 0; k < 3; k++) { try { return dev.gatt.connected ? dev.gatt : await dev.gatt.connect(); } catch (e) { last = e; await sleep(500 * (k + 1)); } }
  throw last;
}
async function collectChars(server) {
  const list = [];
  let services = []; try { services = await server.getPrimaryServices(); } catch (e) { if (e && e.name !== 'NotFoundError') throw e; }
  for (const sv of services) {
    if (BLE_SKIP.includes(sv.uuid)) continue;
    let chars = []; try { chars = await sv.getCharacteristics(); } catch { }
    chars.forEach(ch => list.push({ sv, ch }));
  }
  return list;
}
function pickChar(list) {
  const score = ({ sv, ch }) => (ch.properties.writeWithoutResponse ? 10 : 0) + (ch.properties.write ? 5 : 0) + (BLE_PREF_CHAR.includes(ch.uuid) ? 20 : 0) + Math.max(0, 8 - BLE_SERVICES.indexOf(sv.uuid));
  return list.filter(x => x.ch.properties.write || x.ch.properties.writeWithoutResponse).sort((a, b) => score(b) - score(a))[0] || null;
}
async function connectPrinter(forcePick) {
  if (!navigator.bluetooth) throw new Error(window.isSecureContext === false ? 'ต้องเปิดแอปผ่านลิงก์ https เท่านั้น Bluetooth จึงจะทำงาน' : 'เบราว์เซอร์นี้ไม่รองรับ Web Bluetooth — ใช้ Chrome บน Android หรือเปลี่ยนโหมดเป็น RawBT');
  if (bleChar && bleDev && bleDev.gatt.connected && !forcePick) return bleChar;
  let dev = forcePick ? null : bleDev;
  if (!dev && !forcePick && navigator.bluetooth.getDevices) {
    const saved = LS.get('eh_printer', null);
    if (saved) { try { dev = (await navigator.bluetooth.getDevices()).find(d => d.id === saved.id) || null; } catch { } }
  }
  if (forcePick && bleDev && bleDev.gatt.connected) { try { bleDev.gatt.disconnect(); } catch { } }
  if (!dev) { try { dev = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: bleServiceList() }); } catch (e) { throw new Error(bleErr(e)); } }
  let server; try { server = await gattConnect(dev); } catch (e) { throw new Error(bleErr(e)); }
  const best = pickChar(await collectChars(server));
  if (!best) throw new Error('เชื่อมต่อเครื่องได้ แต่ไม่พบช่องส่งข้อมูลของเครื่องพิมพ์ — ถ้าเป็นเครื่อง Bluetooth Classic ให้ใช้โหมด RawBT หรือกด “ตรวจ Bluetooth” เพื่อดูรายละเอียด/ใส่ Service UUID');
  bleDev = dev; bleChar = best.ch;
  if (!dev._ehBound) { dev._ehBound = true; dev.addEventListener('gattserverdisconnected', () => { bleChar = null; updatePrinterPill(); }); }
  LS.set('eh_printer', { id: dev.id, name: dev.name || 'Printer', svc: best.sv.uuid, chr: best.ch.uuid });
  updatePrinterPill(); return best.ch;
}
// ตรวจสภาพแวดล้อมและบริการ BLE ของเครื่องพิมพ์ — ใช้หาสาเหตุเวลาเชื่อมต่อไม่ได้
async function bleDiagnose() {
  const env = [['เปิดผ่าน https', window.isSecureContext], ['มี Web Bluetooth ในเบราว์เซอร์นี้', !!navigator.bluetooth], ['เป็น Android', /Android/i.test(navigator.userAgent)], ['เป็น Chrome', /Chrome\//.test(navigator.userAgent) && !/EdgA|OPR|SamsungBrowser/i.test(navigator.userAgent)]];

      try { dev.gatt.disconnect(); } catch { }

    return false;
  }, html: `<div>${body}</div><div class="hint">ไม่ต้องจับคู่ในตั้งค่า Bluetooth ของมือถือก่อน ให้เลือกเครื่องจากหน้าต่างของ Chrome โดยตรง ถ้าเครื่องไม่โผล่ในรายการ แสดงว่าเป็น Bluetooth Classic หรือยังเชื่อมต่ออยู่กับอุปกรณ์/แอปอื่น</div><div id="bleOut" class="card" style="box-shadow:none"></div>` });
}

async function bleSend(bytes) {
  const chunk = Math.max(20, Number(S.dev.chunk) || 100);
  let ch = await connectPrinter(false), i = 0, retried = false;
  while (i < bytes.length) {
    const part = bytes.slice(i, i + chunk);
    try {
      if (ch.properties.writeWithoutResponse) await ch.writeValueWithoutResponse(part); else await ch.writeValue(part);
      i += chunk; await sleep(10);
    } catch (e) {
      if (retried) throw new Error(bleErr(e));         // หลุดกลางงาน: ต่อใหม่ 1 ครั้งแล้วพิมพ์ใหม่ทั้งงาน (กันสติกเกอร์ขาดครึ่ง)
      retried = true; bleChar = null; await sleep(400); ch = await connectPrinter(false);
      await (ch.properties.writeWithoutResponse ? ch.writeValueWithoutResponse(new Uint8Array([0x1B, 0x40])) : ch.writeValue(new Uint8Array([0x1B, 0x40]))); i = 0;
    }
  }
}

function toBase64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }

let printing = false;
async function doPrint(order, auto) {
  const label = $('#donePrint');
  if (printing) { if (!auto) toast('กำลังพิมพ์งานก่อนหน้าอยู่ รอสักครู่'); return false; }
  printing = true;
  try {
    if (label && S.view === 'done') label.innerHTML = '🖨️ กำลังพิมพ์สติกเกอร์…';
    if (S.dev.mode === 'ble') await connectPrinter(false);   // ขอเชื่อมต่อก่อน ขณะยังมี user gesture จากการแตะปุ่ม
    const job = await buildJob(order);
    if (S.dev.mode === 'ble') await bleSend(job.bytes);
    else if (S.dev.mode === 'rawbt') { location.href = 'rawbt:base64,' + toBase64(job.bytes); }
    else {
      const { wMm, hMm } = stickerSize();
      let st = $('#pageStyle'); if (!st) { st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
      st.textContent = `@page{size:${wMm}mm ${hMm}mm;margin:0}`;
      $('#printArea').innerHTML = job.canvases.map(c => `<img src="${c.toDataURL('image/png')}">`).join('');
      await sleep(150); print();
    }
    if (label && S.view === 'done') label.innerHTML = '✅ ส่งเข้าเครื่องพิมพ์แล้ว';
    updatePrinterPill();
    return true;
  } catch (e) {
    const msg = (e && e.message) || String(e);
    if (label && S.view === 'done') label.innerHTML = `⚠️ พิมพ์ไม่สำเร็จ: ${esc(msg)} — กด “พิมพ์สติกเกอร์อีกครั้ง”`;
    if (!auto) toast('พิมพ์ไม่สำเร็จ: ' + msg, true);
    return false;
  } finally { printing = false; }
}

function updatePrinterPill() {
  const p = $('#prnPill'); if (!p) return;
  let txt = 'เครื่องพิมพ์', cls = 'pill';
  if (S.dev.mode === 'ble') { const ok = bleChar && bleDev && bleDev.gatt.connected; txt = ok ? 'เครื่องพิมพ์พร้อม' : 'แตะเพื่อเชื่อมต่อเครื่องพิมพ์'; cls += ok ? '' : ' warn'; }
  else if (S.dev.mode === 'rawbt') txt = 'พิมพ์ผ่าน RawBT'; else txt = 'พิมพ์ผ่านเบราว์เซอร์';
  p.className = cls; $('#prnTxt').textContent = txt;
}
